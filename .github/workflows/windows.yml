name: Gerar o instalador para Windows

on:
  push:
    branches: [main]
    paths: ['programa/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gravar o número da versão no programa
        shell: pwsh
        working-directory: programa
        run: |
          $v = (Get-Content ../versao.json -Raw | ConvertFrom-Json).versao
          "VERSAO=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Get-Content app.py -Encoding utf8) -replace "^VERSAO = '.*'", "VERSAO = '$v'" | Set-Content app.py -Encoding utf8
      - name: Instalar dependências
        working-directory: programa
        run: python -m pip install -r requirements.txt
      - name: Gerar o programa
        working-directory: programa
        run: python -m PyInstaller --noconfirm --onefile --windowed --name BlackFlow --icon icone.ico --add-data "happyfeet-gestao.html;." app.py
      - name: Gerar o instalador
        shell: pwsh
        working-directory: programa
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DVersao=$env:VERSAO" instalador.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Colocar o instalador na pasta de download do site
        shell: bash
        run: |
          cp programa/saida/BlackFlow_Instalador.exe download/BlackFlow_Instalador.exe
          git config user.name "BlackFlow Windows"
          git config user.email "actions@users.noreply.github.com"
          git add download/BlackFlow_Instalador.exe
          git commit -m "Instalador do Windows atualizado para a versão $VERSAO" || echo "Sem mudanças"
          git pull --rebase
          git push
