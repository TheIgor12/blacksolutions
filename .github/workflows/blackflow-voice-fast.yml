name: BlackFlow — voz no vídeo (render rápido)
on:
  push:
    branches: [main]
    paths:
      - scripts/narrar_blackflow.py
      - .github/workflows/blackflow-voice-fast.yml
permissions:
  contents: write
concurrency:
  group: bf-voice-render-fast
  cancel-in-progress: false
jobs:
  narracao:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar TTS e conversor de vídeo
        run: python -m pip install --disable-pip-version-check gTTS==2.5.4 imageio-ffmpeg==0.6.0
      - name: Gerar e validar áudio narrado
        run: |
          python scripts/narrar_blackflow.py
          test -s download/BlackFlow_ecossistema_2026_narrado.mp4
      - name: Publicar MP4 narrado
        run: |
          git config user.name "blackflow-ci"
          git config user.email "blackflow-ci@users.noreply.github.com"
          git add download/BlackFlow_ecossistema_2026_narrado.mp4
          git commit -m "media(blackflow): voz feminina em português no vídeo oficial"
          git pull --rebase origin main
          git push origin HEAD:main
