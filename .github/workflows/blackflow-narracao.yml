name: BlackFlow — narrar vídeo Instagram
on:
  push:
    branches: [main]
    paths:
      - scripts/narrar_blackflow.py
      - .github/workflows/blackflow-narracao.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: blackflow-narracao
  cancel-in-progress: false
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check edge-tts==7.2.7
          command -v ffmpeg
      - name: Gerar narração e incorporar no MP4
        run: |
          python scripts/narrar_blackflow.py
          test -s download/BlackFlow_ecossistema_2026_narrado.mp4
          ffprobe -v error -select_streams a -show_entries stream=codec_name -of default=nw=1 download/BlackFlow_ecossistema_2026_narrado.mp4 | grep -q aac
      - name: Publicar resultado, conciliando modificações remotas
        run: |
          git config user.name "blackflow-ci"
          git config user.email "blackflow-ci@users.noreply.github.com"
          git add download/BlackFlow_ecossistema_2026_narrado.mp4
          git commit -m "media(blackflow): vídeo institucional com voz em português brasileiro"
          git pull --rebase origin main
          git push origin HEAD:main
