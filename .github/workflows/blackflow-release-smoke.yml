name: BlackFlow - Verificar publicacao
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar versao, JavaScript, PWA e sincronismo raiz/app
        run: node scripts/auditar-release.mjs
