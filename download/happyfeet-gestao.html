 <table class="tbl mini"><tr><th>Data</th><th>Serviço</th><th>Fórmula ou coloração</th><th>Produtos</th><th>Tempo de pausa</th><th>Profissional</th><th></th></tr>${L.map(f=>`<tr><td>${br(f.data)}</td><td>${esc(f.servico||'')}</td><td>${esc(f.formula||'')}</td><td>${esc(f.produtos||'')}</td><td>${esc(f.pausa||'')}</td><td>${esc(f.profissional||'')}</td><td><button class="lnk" onclick="fichaForm('${p.id}','${f.id}')">Editar</button></td></tr>`).join('')||'<tr><td colspan="7" class="mini-empty">Nenhum registro.</td></tr>'}</table></div>`}
function fichaForm(pid,id){const f=id?S.fichas.find(x=>x.id===id):null;const u=S.fichas.filter(x=>x.pacienteId===pid).sort((a,b)=>(b.data||'').localeCompare(a.data||''))[0]||{};
 formModal(f?'Editar registro':'Novo registro na ficha técnica',[{k:'data',l:'Data',type:'date',req:true},{k:'servico',l:'Serviço',list:'dlServ'},{k:'cabelo',l:'Tipo de cabelo',type:'select',opts:['','Liso','Ondulado','Cacheado','Crespo']},{k:'couro',l:'Couro cabeludo',type:'select',opts:['','Normal','Oleoso','Seco','Sensível','Com caspa']},{k:'formula',l:'Fórmula ou coloração (ex.: 7.1 + 8.0, ox 20 vol.)',full:true},{k:'produtos',l:'Produtos usados',full:true},{k:'pausa',l:'Tempo de pausa'},{k:'profissional',l:'Profissional',list:'dlProf'},{k:'alergias',l:'Alergias e sensibilidades',full:true},{k:'obs',l:'Observação',type:'textarea',full:true,rows:2}],
  f||{data:todayISO(),cabelo:u.cabelo||'',couro:u.couro||'',alergias:u.alergias||''},o=>{if(f)Object.assign(f,o);else S.fichas.push({id:uid(),pacienteId:pid,...o})},
  f?`<button class="btn danger" style="margin-right:auto" onclick="delRec('fichas','${f.id}')">Excluir</button>`:'')}

/* ============ Protocolos (estética) ============ */
function vProtocolos(){return `<div class="page"><div class="phead"><div><h1>Protocolos</h1><p class="sub">Sequências prontas de sessões, com intervalo entre elas. Ao aplicar em um cliente, o sistema cria o pacote e já agenda todas as sessões.</p></div><button class="btn" onclick="protForm()">${ico('plus',16)} Novo protocolo</button></div>
 <div class="grid g3">${S.protocolos.map(p=>`<div class="card"><div style="display:flex;justify-content:space-between"><b>${esc(p.nome)}</b><button class="lnk" onclick="protForm('${p.id}')">Editar</button></div><p class="sub" style="margin:8px 0">${p.sessoes} sessões, uma a cada ${p.intervalo} dias${p.duracao?', '+p.duracao+' minutos cada':''}${p.valor?' · '+money(p.valor):''}</p>${p.descricao?`<p style="font-size:13px">${esc(p.descricao)}</p>`:''}<button class="btn sm" onclick="protAplicar('${p.id}')">Aplicar a um cliente</button></div>`).join('')||'<div class="card empty">Nenhum protocolo. Exemplo: Drenagem pós-operatória, 10 sessões, a cada 2 dias.</div>'}</div></div>`}
function protForm(id){const p=id?S.protocolos.find(x=>x.id===id):null;
 formModal(p?'Editar protocolo':'Novo protocolo',[{k:'nome',l:'Nome do protocolo',req:true,full:true},{k:'servico',l:'Serviço de cada sessão',list:'dlServ'},{k:'sessoes',l:'Número de sessões',type:'number',req:true},{k:'intervalo',l:'Intervalo entre as sessões (dias)',type:'number',req:true},{k:'duracao',l:'Duração de cada sessão (minutos)',type:'number'},{k:'valor',l:'Valor do protocolo completo',type:'dinheiro'},{k:'descricao',l:'Descrição e cuidados',type:'textarea',full:true,rows:3}],
  p||{sessoes:10,intervalo:7,duracao:60},o=>{o.sessoes=Math.max(1,parseInt(o.sessoes,10)||1);o.intervalo=Math.max(1,parseInt(o.intervalo,10)||1);if(p)Object.assign(p,o);else S.protocolos.push({id:uid(),...o})},
  p?`<button class="btn danger" style="margin-right:auto" onclick="delRec('protocolos','${p.id}')">Excluir</button>`:'')}
function protAplicar(id){const pr=S.protocolos.find(x=>x.id===id);
 formModal('Aplicar: '+pr.nome,[{k:'cliente',l:SEG().pessoa,req:true,list:'dlPac',full:true},{k:'inicio',l:'Data da primeira sessão',type:'date',req:true},{k:'hora',l:'Horário',type:'hora15',req:true},{k:'profissional',l:'Profissional',list:'dlProf'},{k:'cobrar',l:'Lançar a cobrança no financeiro',type:'select',opts:['Sim, em aberto','Não']}],{inicio:todayISO(),hora:'09:00',cobrar:'Sim, em aberto'},o=>{const p=ensurePatient(o.cliente);if(!p){toast('Informe o cliente');return false}
  const tid=uid(),g=uid(),prof=ensureProf(o.profissional);S.tratamentos.push({id:tid,pacienteId:p.id,procedimento:pr.nome,data:o.inicio,sessoesTotal:pr.sessoes,sessoesRealizadas:0,valor:Number(pr.valor)||0,statusOrig:'Aprovado',profissional:prof,origem:'manual',pacote:true,protocoloId:pr.id});
  const sv=servPorNome(pr.servico);let d=o.inicio;for(let i=0;i<pr.sessoes;i++){if(i)d=addDays(d,pr.intervalo);if(new Date(d+'T00:00').getDay()===0)d=addDays(d,1);S.agendamentos.push({id:uid(),pacienteId:p.id,data:d,hora:o.hora,duracao:Number(pr.duracao)||(sv?Number(sv.duracao):60)||60,profissional:prof,procedimento:`${pr.servico||pr.nome} (sessão ${i+1}/${pr.sessoes})`,servicoId:sv?sv.id:'',status:'Agendado',obs:'Protocolo '+pr.nome,origem:'manual',protocoloGrupo:g})}
  if(o.cobrar!=='Não'&&Number(pr.valor)>0)S.lancamentos.push({id:uid(),pacienteId:p.id,descricao:'Protocolo: '+pr.nome,valor:Number(pr.valor),valorPago:0,vencimento:o.inicio,pagamento:'',forma:'',parcela:'',statusOrig:'Em aberto',profissional:'',origem:'manual'});
  setTimeout(()=>toast(pr.sessoes+' sessões agendadas para '+p.nome+'. Os domingos foram pulados.'),50)})}

/* ============ Equipamentos (estética) ============ */
function proxManut(e){return e.ultimaManut&&e.intervaloManut?addDays(e.ultimaManut,Number(e.intervaloManut)):''}
function horasEquip(e){return r2((e.usos||[]).reduce((a,u)=>a+(Number(u.horas)||0),0)+(Number(e.horasIniciais)||0))}
function alertasEquip(){const t=addDays(todayISO(),15);return S.equipamentos.filter(e=>{const pm=proxManut(e);return (pm&&pm<=t)||(e.limiteHoras&&horasEquip(e)>=Number(e.limiteHoras)*0.9)})}
function vEquipamentos(){return `<div class="page"><div class="phead"><div><h1>Equipamentos</h1><p class="sub">Horas de uso, manutenção preventiva e vida útil de ponteiras e lâmpadas.</p></div><button class="btn" onclick="equipForm()">${ico('plus',16)} Novo equipamento</button></div>
 <div class="grid g3">${S.equipamentos.map(e=>{const pm=proxManut(e),h=horasEquip(e),venc=pm&&pm<=todayISO(),perto=pm&&!venc&&pm<=addDays(todayISO(),15),lim=e.limiteHoras&&h>=Number(e.limiteHoras)*0.9;
  return `<div class="card" style="border-top:4px solid ${venc||lim?'var(--bad)':perto?'var(--warn)':'var(--ok)'}"><div style="display:flex;justify-content:space-between"><b>${esc(e.nome)}</b><button class="lnk" onclick="equipForm('${e.id}')">Editar</button></div><p class="sub" style="margin:6px 0">${esc([e.marca,e.serie?'Série '+e.serie:''].filter(Boolean).join(' · '))}</p>
  <div class="row"><span>Horas de uso</span><span><b>${h}</b>${e.limiteHoras?' de '+e.limiteHoras:''}</span></div><div class="row"><span>Última manutenção</span><span>${br(e.ultimaManut)}</span></div><div class="row"><span>Próxima manutenção</span><span style="color:${venc?'var(--bad)':perto?'var(--warn)':'inherit'}">${pm?br(pm):'-'}</span></div>
  <div class="mact" style="justify-content:flex-start"><button class="btn sm" onclick="equipUso('${e.id}')">Registrar uso</button><button class="btn ghost sm" onclick="equipManut('${e.id}')">Registrar manutenção</button></div></div>`}).join('')||'<div class="card empty">Nenhum equipamento cadastrado.</div>'}</div></div>`}
function equipForm(id){const e=id?S.equipamentos.find(x=>x.id===id):null;
 formModal(e?'Editar equipamento':'Novo equipamento',[{k:'nome',l:'Nome do equipamento',req:true,full:true},{k:'marca',l:'Marca e modelo'},{k:'serie',l:'Número de série'},{k:'horasIniciais',l:'Horas de uso já existentes',type:'number'},{k:'limiteHoras',l:'Limite de horas (ponteira ou lâmpada)',type:'number'},{k:'ultimaManut',l:'Última manutenção',type:'date'},{k:'intervaloManut',l:'Manutenção a cada (dias)',type:'number'},{k:'obs',l:'Observação',type:'textarea',full:true,rows:2}],
  e||{intervaloManut:180},o=>{if(e)Object.assign(e,o);else S.equipamentos.push({id:uid(),usos:[],manutencoes:[],...o})},
  e?`<button class="btn danger" style="margin-right:auto" onclick="delRec('equipamentos','${e.id}')">Excluir</button>`:'')}
function equipUso(id){const e=S.equipamentos.find(x=>x.id===id);formModal('Uso: '+e.nome,[{k:'data',l:'Data',type:'date',req:true},{k:'horas',l:'Horas usadas (ex.: 0,5)',type:'number',req:true},{k:'obs',l:'Cliente ou observação',full:true}],{data:todayISO()},o=>{(e.usos||(e.usos=[])).push({data:o.data,horas:parseNum(o.horas),obs:o.obs})})}
function equipManut(id){const e=S.equipamentos.find(x=>x.id===id);formModal('Manutenção: '+e.nome,[{k:'data',l:'Data',type:'date',req:true},{k:'tipo',l:'Tipo',type:'select',opts:['Preventiva','Corretiva','Troca de ponteira ou lâmpada']},{k:'custo',l:'Custo',type:'dinheiro'},{k:'obs',l:'Observação',full:true}],{data:todayISO(),tipo:'Preventiva'},o=>{(e.manutencoes||(e.manutencoes=[])).push(o);e.ultimaManut=o.data;if(/ponteira|lâmpada/i.test(o.tipo)){e.horasIniciais=0;e.usos=[]}
  if(parseNum(o.custo)>0)S.contasPagar.push({id:uid(),descricao:'Manutenção: '+e.nome,fornecedor:'',categoria:'Manutenção de equipamentos',tipo:'Custo Variável',vencimento:o.data,valor:parseNum(o.custo),valorPago:parseNum(o.custo),pagamento:o.data,statusOrig:'Pago',obs:o.obs||'',origem:'manual'})})}

/* ============ Imposto de Renda: demonstrativo anual de rendimentos e despesas ============ */
function irDados(ano){const a=String(ano);const E=entradasList().filter(x=>(x.data||'').startsWith(a)),Sa=saidasList().filter(x=>(x.data||'').startsWith(a));
 const meses=Array.from({length:12},(_,i)=>({m:i+1,ent:0,sai:0}));E.forEach(x=>{meses[+x.data.slice(5,7)-1].ent+=x.valor});Sa.forEach(x=>{meses[+x.data.slice(5,7)-1].sai+=x.valor});
 const porPac={};E.forEach(x=>{const p=pac(x.l.pacienteId);const k=p?p.id:'?';const o=porPac[k]||(porPac[k]={p,total:0,n:0,meses:{}});o.total+=x.valor;o.n++;const mm=x.data.slice(5,7);o.meses[mm]=(o.meses[mm]||0)+x.valor});
 const porCat={};Sa.forEach(x=>{const k=x.c.categoria||'Sem categoria';porCat[k]=(porCat[k]||0)+x.valor});
 const porForma={};E.forEach(x=>{const k=(x.pg&&x.pg.forma)||x.l.forma||'Não informada';porForma[k]=(porForma[k]||0)+x.valor});
 return {E,Sa,meses,porPac:Object.values(porPac).sort((a,b)=>b.total-a.total),porCat:Object.entries(porCat).sort((a,b)=>b[1]-a[1]),porForma:Object.entries(porForma).sort((a,b)=>b[1]-a[1]),tE:E.reduce((a,x)=>a+x.valor,0),tS:Sa.reduce((a,x)=>a+x.valor,0)}}
function fIR(){const ano=UI.irAno||new Date().getFullYear()-1;const D=irDados(ano);const semCpf=D.porPac.filter(o=>!o.p||!keyCPF(o.p.cpf));
 const anos=[...new Set([new Date().getFullYear(),new Date().getFullYear()-1,...entradasList().map(x=>+(x.data||'').slice(0,4)).filter(Boolean)])].sort((a,b)=>b-a);
 return `<div class="phead"><div><h1>Imposto de Renda</h1><p class="sub">Demonstrativo dos rendimentos recebidos e das despesas pagas no ano, para a declaração e para o Carnê-Leão.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><label class="filters" style="margin:0"><span style="font-size:12px;color:var(--mut)">Ano</span><select onchange="UI.irAno=+this.value;render()">${anos.map(a=>`<option ${a===ano?'selected':''}>${a}</option>`).join('')}</select></label><button class="btn ghost" onclick="irExcel(${ano})">${ico('down',16)} Excel</button><button class="btn" onclick="irImprimir(${ano})">${ico('print',16)} Imprimir demonstrativo</button></div></div>
 <div class="note">Os valores são os pagamentos registrados no BlackFlow, pela data em que foram recebidos. Confira com o seu contador antes de declarar: a forma de tributação depende de você trabalhar como pessoa física ou como empresa.</div>
 <div class="grid g3"><div class="kpi g"><small>Rendimentos recebidos em ${ano}</small><b>${money(D.tE)}</b><span>${D.E.length} recebimentos de ${D.porPac.length} ${SEG().pessoas.toLowerCase()}</span></div><div class="kpi r"><small>Despesas pagas em ${ano}</small><b>${money(D.tS)}</b><span>${D.Sa.length} contas pagas</span></div><div class="kpi"><small>Resultado do ano</small><b style="color:${D.tE-D.tS>=0?'var(--ok)':'var(--bad)'}">${money(D.tE-D.tS)}</b><span>Rendimentos menos despesas</span></div></div>
 <div class="card"><h2>Mês a mês</h2><table class="tbl"><tr><th>Mês</th><th class="num">Rendimentos</th><th class="num">Despesas</th><th class="num">Resultado</th></tr>${D.meses.map(x=>`<tr><td>${MESES[x.m-1]}</td><td class="num">${money(x.ent)}</td><td class="num">${money(x.sai)}</td><td class="num" style="color:${x.ent-x.sai>=0?'var(--ok)':'var(--bad)'}">${money(x.ent-x.sai)}</td></tr>`).join('')}<tr><td><b>Total</b></td><td class="num"><b>${money(D.tE)}</b></td><td class="num"><b>${money(D.tS)}</b></td><td class="num"><b>${money(D.tE-D.tS)}</b></td></tr></table></div>
 <div class="grid g2"><div class="card" style="margin:0"><h2>Despesas por categoria</h2>${D.porCat.map(([k,v])=>`<div class="row"><span>${esc(k)}</span><span>${money(v)}</span></div>`).join('')||'<div class="mini-empty">Nenhuma despesa paga no ano.</div>'}</div>

const AVISO={vistos:{},timer:null};

function avisoSom(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C();[0,0.35].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(0.0001,c.currentTime+t);g.gain.exponentialRampToValueAtTime(0.3,c.currentTime+t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+t+0.3);o.connect(g);g.connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+0.32)})}catch(e){}}
function avisoChecar(){if(S.config.avisoAgenda===false||UI.auth)return;const t=todayISO(),n=new Date(),agora=n.getHours()*60+n.getMinutes()+n.getSeconds()/60;const novos=[];
 S.agendamentos.forEach(a=>{if(a.data!==t)return;if(['Desmarcado','Faltou','Atendido'].includes(stAg(a)))return;const [h,m]=(a.hora||'').split(':').map(Number);if(isNaN(h))return;const falta=h*60+(m||0)-agora;
  let etapa='';if(falta>5&&falta<=15)etapa='15';else if(falta>=-1&&falta<=5)etapa='5';if(!etapa)return;const k=a.id+':'+etapa;if(AVISO.vistos[k])return;
  if(etapa==='15'&&AVISO.vistos[a.id+':5'])return;AVISO.vistos[k]=1;novos.push({a,falta:Math.max(0,Math.round(falta)),etapa})});
 if(!novos.length)return;avisoGravar();novos.forEach(avisoMostrar);avisoSom();
 try{if(window.pywebview&&window.pywebview.api&&window.pywebview.api.chamar_atencao)window.pywebview.api.chamar_atencao()}catch(e){}
 try{if('Notification' in window&&Notification.permission==='granted')novos.forEach(x=>{const p=pac(x.a.pacienteId);new Notification('BlackFlow: atendimento às '+x.a.hora,{body:(p?p.nome:'')+(x.falta?' em '+x.falta+' minutos':' agora')})})}catch(e){}}
function avisoMostrar({a,falta}){let box=document.getElementById('avisos');if(!box){box=document.createElement('div');box.id='avisos';document.body.appendChild(box)}
 const p=pac(a.pacienteId);const d=document.createElement('div');d.className='aviso';const quando=falta>0?`em <b>${falta} ${falta===1?'minuto':'minutos'}</b>`:'<b>agora</b>';
 d.innerHTML=`<div class="aviso-t">${ico('alert',18)} Está chegando a hora do atendimento</div><div class="aviso-n">${esc(p?p.nome:SEG().pessoa)}</div><div class="aviso-d">Às ${esc(a.hora)}, ${quando}${a.profissional?' · '+esc(a.profissional):''}${a.procedimento?'<br>'+esc(a.procedimento):''}</div>
 <div class="aviso-b">${p?`<button class="btn sm" data-f="ficha">Abrir ficha</button>`:''}<button class="btn ghost sm" data-f="ok">Ciente</button></div>`;
 d.querySelector('[data-f=ok]').onclick=()=>d.remove();const bf=d.querySelector('[data-f=ficha]');if(bf)bf.onclick=()=>{d.remove();go('paciente',p.id)};
 box.appendChild(d)}
function avisoIniciar(){avisoCarregar();clearInterval(AVISO.timer);AVISO.timer=setInterval(avisoChecar,20000);setTimeout(avisoChecar,3000);
 try{if('Notification' in window&&Notification.permission==='default'&&!window.pywebview)setTimeout(()=>Notification.requestPermission(),8000)}catch(e){}}

 const antes=S.agendamentos.some(x=>x.pacienteId===a.pacienteId&&x.id!==a.id&&stAg(x)!=='Desmarcado'&&(x.data+' '+(x.hora||''))<k);if(antes)return false;

 return !hist('evolucoes')&&!hist('tratamentos')&&!S.lancamentos.some(l=>l.pacienteId===a.pacienteId&&l.pagamento&&l.pagamento<a.data)}

/* ============ Valor do procedimento lançado pela agenda (podologia) ============ */
const lancAgAtivo=()=>!soAgenda()&&ehSeg('podologia')&&S.config.lancarAgenda!==false;
const semCobranca=nome=>S.config.retornoGratis!==false&&/^\s*(retorno|avalia[cç][aã]o)\b/i.test(String(nome||''));
function precoProc(nome){if(semCobranca(nome))return 0;const sv=servPorNome(nome);if(!sv||sv.ativo===false)return 0;if(Number(sv.preco)>0)return Number(sv.preco);const pp=Number(sv.precoPacote),n=Number(sv.sessoesPacote);return pp>0&&n>0?r2(pp/n):0}
function precoTabela(nome){const sv=servPorNome(nome);if(!sv)return 0;if(Number(sv.preco)>0)return Number(sv.preco);const pp=Number(sv.precoPacote),n=Number(sv.sessoesPacote);return pp>0&&n>0?r2(pp/n):0}
/* Pacotes: o pacote é lançado no financeiro uma única vez; cada sessão feita é só contada, sem nova cobrança */
const PAL_IGN=new Set(['sessao','sessoes','pacote','pacotes','plano','planos','tratamento','unha','unhas','para','com']);
const semParen=x=>String(x||'').replace(/\(.*?\)/g,' ');
function palavrasProc(x){return norm(semParen(x)).split(' ').filter(w=>w.length>=4&&!PAL_IGN.has(w)&&!/^\d+$/.test(w))}
function procCombina(x,y){const a=norm(semParen(x)),b=norm(semParen(y));if(!a||!b)return false;if(a===b||(b.length>=4&&a.includes(b))||(a.length>=4&&b.includes(a)))return true;
 const A=palavrasProc(x),B=palavrasProc(y);return A.some(w=>B.some(z=>z===w||(w.length>=5&&z.length>=5&&w.slice(0,5)===z.slice(0,5))))}
const sessTot=t=>Math.max(1,parseInt(t.sessoesTotal,10)||1);
function pacotesAbertos(pid){return S.tratamentos.filter(t=>t.pacienteId===pid&&(sessTot(t)>1||t.pacote)&&!['Concluído','Reprovado'].includes(stTrat(t))&&(t.sessoesRealizadas||0)<sessTot(t))}
function servEhPacote(nome){const sv=servPorNome(nome);const n=Number(sv&&sv.sessoesPacote)||0;if(n>1)return n;const m=String(nome||'').match(/(\d+)\s*sess/i);return m&&+m[1]>1?+m[1]:0}
function pacoteDoAg(a,fraco){if(!a||a.semPacote)return null;if(a.tratamentoId){const t=S.tratamentos.find(x=>x.id===a.tratamentoId);if(t)return t}
 const L=pacotesAbertos(a.pacienteId);if(!L.length)return null;const n=norm(semParen(a.procedimento));
 const forte=n&&L.find(t=>norm(semParen(t.procedimento))===n);if(forte)return forte;
 return (fraco||servEhPacote(a.procedimento))?(L.find(t=>procCombina(a.procedimento,t.procedimento))||null):null}
function pacoteAtivo(a){return pacoteDoAg(a,true)}
function precisaPerguntar(a){return !!a&&!a.semPacote&&!a.sessaoPacote&&!!(pacoteDoAg(a,true)||servEhPacote(a.procedimento))}
function sessTagAg(a){if(!a.sessaoPacote)return '';const t=S.tratamentos.find(x=>x.id===a.tratamentoId);return `<i class="evtag" style="background:#475569">${a.sessaoPacote}/${t?sessTot(t):'?'}</i>`}
/* Desmarcado não ocupa o horário: sozinho, aparece transparente na largura toda; se outro agendamento ocupar o horário, vira uma faixa estreita à direita */
function agEstilo(it,pos,nL){const ov=(x,y)=>x.st<y.en&&y.st<x.en;
 if(it.L<0)return pos.some(y=>y.L>=0&&ov(it,y))?'right:2px;width:26%':'left:2px;width:calc(100% - 4px)';
 const f=pos.some(x=>x.L<0&&ov(it,x))?74:100;return `left:calc(${it.L*f/nL}% + 2px);width:calc(${f/nL}% - 4px)`}
function agHorarioLivre(id){const a=S.agendamentos.find(x=>x.id===id);if(!a)return;closeModal();agForm(null,null,{data:a.data,hora:a.hora,duracao:a.duracao,profissional:a.profissional})}
function agSessHTML(a){const s=stAg(a);
 if(s==='Desmarcado')return `<div class="row" style="align-items:center"><span>Horário</span><span style="text-align:right">Livre para outro agendamento<br><button class="btn sm" style="margin-top:6px" onclick="agHorarioLivre('${a.id}')">Agendar neste horário</button></span></div>`;
 if(a.sessaoPacote){const t=S.tratamentos.find(x=>x.id===a.tratamentoId);const T=t?sessTot(t):0;const falta=t?T-(t.sessoesRealizadas||0):0;
  return `<div class="row"><span>Sessão do pacote</span><span style="text-align:right"><b>Sessão ${a.sessaoPacote}${T?' de '+T:''}</b>${t?'<br><small style="color:var(--mut)">'+esc(t.procedimento)+' · '+(falta>0?'faltam '+falta+(falta===1?' sessão':' sessões'):'pacote concluído')+'</small>':''}</span></div>`}
 if(s==='Atendido'&&precisaPerguntar(a))return `<div class="row" style="align-items:center;background:#fff7e6;border-radius:8px;padding:8px"><span><b>Sessão do pacote pendente</b><br><small style="color:var(--mut);font-weight:400">Nada foi lançado no financeiro ainda.</small></span><span><button class="btn sm" onclick="perguntarSessao('${a.id}')">Executar sessão</button></span></div>`;
 return ''}
function perguntarSessao(id){const a=S.agendamentos.find(x=>x.id===id);if(!a)return;const p=pac(a.pacienteId);const L=pacotesAbertos(a.pacienteId);const sug=pacoteDoAg(a,true);const nS=servEhPacote(a.procedimento);
 const cab=`<p class="sub">${esc(p?p.nome:'')} · ${br(a.data)} às ${esc(a.hora||'')} · ${esc(a.procedimento||'')}</p>`;
 const bts=`<button class="btn ghost" style="margin-right:auto" onclick="sessVoltar('${a.id}')">Voltar, não foi atendido</button><button class="btn ghost" onclick="sessAvulso('${a.id}')">Não, atendimento avulso</button>`;
 if(L.length&&((sug&&L.includes(sug))||!nS)){const sel=sug&&L.includes(sug)?sug:L[0];
  openModal(`<h3>Executar sessão do pacote?</h3>${cab}<p style="margin:12px 0 6px">A sessão é só contada no pacote. Nada é lançado de novo no financeiro.</p>`+L.map(t=>{const f=t.sessoesRealizadas||0,T=sessTot(t),dep=T-f-1;
   return `<label class="row" style="cursor:pointer;align-items:center"><span><input type="radio" name="sessPac" value="${t.id}" ${t===sel?'checked':''} style="margin-right:8px">${esc(t.procedimento)}<br><small style="color:var(--mut);font-weight:400">Feitas ${f} de ${T}. Esta será a sessão ${f+1}; depois ${dep===0?'o pacote termina':'faltarão '+dep+(dep===1?' sessão':' sessões')}.</small></span><b>${f}/${T}</b></label>`}).join('')+

function temAlteracaoLocal(k,obj){return NV.hashes[k]!==undefined&&NV.hashes[k]!==JSON.stringify(obj)}
function aplicarRemoto(r){const k=r.colecao+':'+r.id;
 if(r.colecao==='config'){if(temAlteracaoLocal(k,S.config))return;S.config={...defaultState().config,...r.dados};NV.hashes[k]=JSON.stringify(S.config);return}

  if(error)throw error;data.forEach(aplicarRemoto);n+=data.length;if(data.length)NV.cursor=data[data.length-1].seq;if(data.length<1000)break}
 if(n){processarOnline();persistirNuvem()}return n}

async function enviar(){if(!NV.sb||!NV.clinicaId||NV.offline)return;if(NV.ocupado){agendarEnvio();return}NV.ocupado=true;
 try{const ups=[],vistos={};
  COLS.forEach(c=>(S[c]||[]).forEach(x=>{const k=c+':'+x.id;const j=JSON.stringify(x);vistos[k]=1;if(NV.hashes[k]!==j)ups.push({row:{clinica_id:NV.clinicaId,colecao:c,id:String(x.id),dados:x,excluido:false},k,j})}));
  const cj=JSON.stringify(S.config);if(NV.hashes['config:config']!==cj)ups.push({row:{clinica_id:NV.clinicaId,colecao:'config',id:'config',dados:S.config,excluido:false},k:'config:config',j:cj});
  Object.keys(NV.hashes).forEach(k=>{if(k==='config:config'||vistos[k]||!NV.hashes[k])return;const i=k.indexOf(':');ups.push({row:{clinica_id:NV.clinicaId,colecao:k.slice(0,i),id:k.slice(i+1),dados:{},excluido:true},k,j:null})});
  if(!ups.length){setSync('ok');return}setSync('env');
  const lotes=[];let atual=[],tam=0;ups.forEach(u=>{const t=(u.j||'').length;if(atual.length&&(atual.length>=400||tam+t>2500000)){lotes.push(atual);atual=[];tam=0}atual.push(u);tam+=t});if(atual.length)lotes.push(atual);
  for(const lote of lotes){const {error}=await NV.sb.from('registros').upsert(lote.map(u=>u.row),{onConflict:'clinica_id,colecao,id'});if(error)throw error;lote.forEach(u=>{NV.hashes[u.k]=u.j})}
  persistirNuvem();setSync('ok')}
 catch(e){console.warn(e);setSync(navigator.onLine===false||/fetch|network/i.test(String(e&&e.message))?'off':'err')}
 finally{NV.ocupado=false}}

async function abrirConta(){if(!NV.ativa){go('config');return}const u=NV.sessao.user;
 let membros=[],convites=[];if(!NV.offline){const a=await NV.sb.from('membros').select('user_id,email,nome,papel').eq('clinica_id',NV.clinicaId);membros=a.data||[];if(NV.papel==='admin'){const b=await NV.sb.from('convites').select('email,papel').eq('clinica_id',NV.clinicaId);convites=b.data||[]}}
 openModal(`<h3>Minha conta</h3><div class="row"><span>Nome</span><span>${esc(nomeUsuario())}</span></div><div class="row"><span>E-mail</span><span>${esc(u.email)}</span></div><div class="row"><span>Clínica</span><span>${esc(NV.nomeClinica)}</span></div><div class="row"><span>Perfil</span><span>${NV.papel==='admin'?'Administrador':'Usuário'}</span></div><div class="row"><span>Plano</span><span>${NV.plano==='teste'?'Teste grátis até '+br(NV.validoAte):NV.plano==='cortesia'?'Cortesia, sem vencimento':NV.validoAte?'Assinatura válida até '+br(NV.validoAte):esc(NV.plano||'-')} ${NV.plano!=='cortesia'?'<button class="lnk" onclick="closeModal();abrirAssinatura()">Assinar</button>':''}</span></div><div class="row"><span>Versão</span><span id="verApp">${VERSAO_APP}</span></div>
 ${membros.length?`<h3 style="margin-top:20px">Equipe</h3>${membros.map(m=>`<div class="row"><span>${esc(m.nome||m.email)}<br><small style="color:var(--mut);font-weight:400">${esc(m.email)} . ${m.papel==='admin'?'Administrador':'Usuário'}</small></span><span>${NV.papel==='admin'&&m.user_id!==u.id?`<button class="lnk" style="color:var(--bad)" onclick="removerMembro('${m.user_id}','${esc(m.email)}')">Remover</button>`:''}</span></div>`).join('')}`:''}
 ${convites.length?`<h3 style="margin-top:20px">Convites pendentes</h3>${convites.map(c=>`<div class="row"><span>${esc(c.email)}</span><span><button class="lnk" onclick="cancelarConvite('${esc(c.email)}')">Cancelar</button></span></div>`).join('')}`:''}
 ${NV.papel==='admin'&&!NV.offline?`<h3 style="margin-top:20px">Convidar pessoa da equipe</h3><div class="fgrid"><label>E-mail<input id="cv_email" type="email"></label><label>Perfil<select id="cv_papel"><option value="usuario">Usuário</option><option value="admin">Administrador</option></select></label></div><div class="mact" style="justify-content:flex-start"><button class="btn" onclick="convidar()">Enviar convite</button></div><p class="sub">A pessoa baixa o programa, clica em Criar conta e usa exatamente este e-mail. Ao entrar, ela já cai na sua clínica.</p>`:''}
 <div class="mact"><button class="btn ghost" onclick="closeModal()">Fechar</button><button class="btn danger" onclick="sair()">Sair</button></div>`,true);
 if(window.pywebview&&window.pywebview.api&&window.pywebview.api.versao){window.pywebview.api.versao().then(v=>{const e=$('#verApp');if(e)e.textContent=v.app})}}
async function convidar(){const email=val('#cv_email');if(!email){toast('Informe o e-mail');return}const {error}=await NV.sb.rpc('convidar',{p_clinica:NV.clinicaId,p_email:email,p_papel:$('#cv_papel').value});if(error){toast(traduz(error));return}toast('Convite registrado para '+email);abrirConta()}
async function cancelarConvite(email){const {error}=await NV.sb.rpc('cancelar_convite',{p_clinica:NV.clinicaId,p_email:email});if(error)toast(traduz(error));abrirConta()}
function removerMembro(id,email){confirmModal(`Remover <b>${esc(email)}</b> da clínica? A pessoa perde o acesso imediatamente.`,async()=>{const {error}=await NV.sb.rpc('remover_membro',{p_clinica:NV.clinicaId,p_user:id});if(error)toast(traduz(error));else toast('Usuário removido')},'Remover')}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[target=_blank]');if(a&&window.pywebview&&window.pywebview.api&&window.pywebview.api.abrir_link){e.preventDefault();window.pywebview.api.abrir_link(a.href)}});

/* ============ Início do aplicativo ============ */
(async function(){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 try{if(/^https?:/.test(location.protocol)&&'serviceWorker' in navigator&&!window.pywebview)navigator.serviceWorker.register('sw.js')}catch(e){}
 if(NV.ativa){
  if(!window.supabase||!window.supabase.createClient){UI.auth={modo:'offline',temCache:!!(await DB.get('ultimo'))};render();return}
  NV.sb=window.supabase.createClient(NUVEM.url,NUVEM.chave,{auth:{persistSession:true,autoRefreshToken:true}});
  NV.sb.auth.onAuthStateChange((ev,ses)=>{if(ev==='TOKEN_REFRESHED'&&ses)NV.sessao=ses});
  let ses=null;try{ses=(await NV.sb.auth.getSession()).data.session}catch(e){}
  if(ses){try{await entrar(ses)}catch(e){UI.auth={modo:'offline',temCache:!!(await DB.get('ultimo'))};render()}}else{UI.auth={modo:'entrar'};render()}
  return}
 const saved=await DB.get();if(saved&&Array.isArray(saved.pacientes)){const d=defaultState();S={...d,...saved,config:{...d.config,...(saved.config||{})}};if(S.config.cor==='#e8622c')S.config.cor='#0a4bde'}
 render();
 const lb=S.config.ultimoBackup;if(S.pacientes.length&&(!lb||diffDays(lb,todayISO())>7))setTimeout(()=>toast('Lembrete: faça o backup semanal em Configurações.'),1500)})();
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();if(UI.drawer){UI.drawer=false;render()}}});

/* Olhinho para mostrar ou esconder a senha */
const OLHO='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>',OLHO_X='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.4 3.4M6.6 6.6A17.5 17.5 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2M2 2l20 20"/></svg>';
function olhoSenha(){document.querySelectorAll('input[type=password]:not([data-olho])').forEach(i=>{i.dataset.olho=1;const w=document.createElement('span');w.className='olhoW';i.parentNode.insertBefore(w,i);w.appendChild(i);const b=document.createElement('button');b.type='button';b.className='olhoB';b.title='Mostrar senha';b.innerHTML=OLHO;
 b.onclick=e=>{e.preventDefault();const ver=i.type==='password';i.type=ver?'text':'password';b.innerHTML=ver?OLHO_X:OLHO;b.title=ver?'Esconder senha':'Mostrar senha';i.focus()};w.appendChild(b)})}
new MutationObserver(olhoSenha).observe(document.documentElement,{childList:true,subtree:true});
/* Datas com barras automáticas (dd/mm/aaaa) em qualquer navegador e R$ nos campos de dinheiro */
const isoBr=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'')?v.slice(8,10)+'/'+v.slice(5,7)+'/'+v.slice(0,4):'';
function dataValida(d,m,a){const x=new Date(a,m-1,d);return a>=1900&&a<=2100&&x.getFullYear()===a&&x.getMonth()===m-1&&x.getDate()===d}
function mascaraData(){document.querySelectorAll('input[type=date]:not([data-mask])').forEach(o=>{o.dataset.mask=1;
 const w=document.createElement('span');w.className='dtW';o.parentNode.insertBefore(w,o);
 const t=document.createElement('input');t.type='text';t.inputMode='numeric';t.autocomplete='off';t.placeholder='dd/mm/aaaa';t.maxLength=10;t.className='dtT';if(o.getAttribute('style'))t.setAttribute('style',o.getAttribute('style'));t.disabled=o.disabled;t.value=isoBr(o.value);
 if(o.required){t.required=true;o.required=false}if(o.id){const l=document.querySelector(`label[for="${o.id}"]`);if(l){t.id=o.id+'_txt';l.htmlFor=t.id}}
 const b=document.createElement('button');b.type='button';b.className='dtB';b.title='Abrir calendário';b.tabIndex=-1;b.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
 w.appendChild(t);w.appendChild(o);w.appendChild(b);
 const avisar=()=>{o.dispatchEvent(new Event('input',{bubbles:true}));o.dispatchEvent(new Event('change',{bubbles:true}))};
 t.addEventListener('input',e=>{const d=t.value.replace(/\D/g,'').slice(0,8);let f=d;if(d.length>4)f=d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4);else if(d.length>2)f=d.slice(0,2)+'/'+d.slice(2);if(t.value!==f)t.value=f;
  if(d.length===8){const dd=+d.slice(0,2),mm=+d.slice(2,4),aa=+d.slice(4);if(dataValida(dd,mm,aa)){o.value=d.slice(4)+'-'+d.slice(2,4)+'-'+d.slice(0,2);t.classList.remove('dtErr');t.setCustomValidity('');avisar()}else{t.classList.add('dtErr');t.setCustomValidity('Data inválida')}}
  else if(!d.length){o.value='';t.classList.remove('dtErr');t.setCustomValidity('');avisar()}else{t.setCustomValidity(t.required||d.length?'Complete a data: dia, mês e ano':'')}});
 t.addEventListener('blur',()=>{if(t.value&&t.value.length<10)t.classList.add('dtErr')});
 o.addEventListener('change',()=>{const v=isoBr(o.value);if(v!==t.value){t.value=v;t.classList.remove('dtErr');t.setCustomValidity('')}});
 b.onclick=e=>{e.preventDefault();try{o.showPicker()}catch(x){o.focus();o.click()}}})}
const DINHEIRO_CHAVE=/(^|[\s_\-.])(valor|valorpago|preco|precopacote|custo|abertura|total|pago|agvalbase|agexv|lv|pval|adia|ateto|cvc|tpri|tbase|ldvalor)($|[\s_\-.])/i;
function ehDinheiro(i){if(i.dataset.rs!==undefined)return i.dataset.rs!=='0';if(['checkbox','radio','date','hidden','file','time','email','tel','password'].includes(i.type))return false;
 const k=[i.name,i.id,...i.classList].filter(Boolean).join(' ');if(/(pct|percent|comiss|qtd|sessoes|dias|horas|duracao|intervalo|minimo|repetir|limite|peso|altura)/i.test(k))return false;
 if(DINHEIRO_CHAVE.test(k))return true;const l=i.closest('label');const tx=l?(l.querySelector('span')||l).textContent:'';return /R\$|\bvalor\b|\bpreço\b|\bcusto\b/i.test(tx)&&!/%|\bdias?\b|\bminutos?\b|\bsess/i.test(tx)}
function prefixoReais(){document.querySelectorAll('input:not([data-rsok])').forEach(i=>{i.dataset.rsok=1;if(!ehDinheiro(i))return;const w=document.createElement('span');w.className='rsW';i.parentNode.insertBefore(w,i);const s=document.createElement('span');s.className='rsP';s.textContent='R$';w.appendChild(s);w.appendChild(i)})}
new MutationObserver(()=>{mascaraData();prefixoReais()}).observe(document.documentElement,{childList:true,subtree:true});

/* Campos de hora: de 15 em 15 minutos (setas do teclado e roda do mouse) */
function hora15(){document.querySelectorAll('input[type=time]:not([data-h15])').forEach(i=>{i.dataset.h15=1;if(!i.step||i.step==='60')i.step=900;
 i.addEventListener('wheel',e=>{if(document.activeElement!==i)return;e.preventDefault();const [h,m]=(i.value||'08:00').split(':').map(Number);let t=h*60+m;t=e.deltaY<0?Math.floor(t/15)*15+15:Math.ceil(t/15)*15-15;t=Math.max(0,Math.min(23*60+45,t));i.value=pad(Math.floor(t/60))+':'+pad(t%60);i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}))},{passive:false})});
 document.querySelectorAll('select.hora15:not([data-h15])').forEach(sl=>{sl.dataset.h15=1;sl.addEventListener('wheel',e=>{if(document.activeElement!==sl)return;e.preventDefault();const n=sl.selectedIndex+(e.deltaY<0?-1:1);if(n>=0&&n<sl.options.length){sl.selectedIndex=n;sl.dispatchEvent(new Event('change',{bubbles:true}))}},{passive:false})})}
new MutationObserver(hora15).observe(document.documentElement,{childList:true,subtree:true});
/* Agenda de um profissional, aberta pelo menu lateral */
function agProf(nome){UI.profOff={};if(nome){S.profissionais.forEach(p=>{if(norm(p.nome)!==norm(nome))UI.profOff[p.nome]=true});UI.profOff['']=true}UI.agProf=nome||'';UI.drawer=false;go('agenda')}
function menuProfs(){const L=S.profissionais.filter(p=>p.ativo!==false).sort((a,b)=>a.nome.localeCompare(b.nome));if(!L.length)return '';const sel=UI.view==='agenda'?(UI.agProf||''):null;
 return `<div class="msec">AGENDA POR PROFISSIONAL</div><button class="${sel===''&&UI.view==='agenda'?'on':''}" onclick="agProf('')">${ico('cal',18)} Todos os profissionais</button>${L.map(p=>`<button class="${sel!=null&&norm(sel)===norm(p.nome)?'on':''}" onclick="agProf(${esc(JSON.stringify(p.nome))})"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${esc(p.cor||'#0a4bde')};margin:0 3px;flex:none"></span> ${esc(p.nome)}</button>`).join('')}`}
</script>
