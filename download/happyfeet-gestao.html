<style>
:root{--acc:#0b6cf2;--acc-soft:color-mix(in srgb,var(--acc) 9%,#fff);--navy:#254775;--bg:#f2f2f3;--card:#fff;--ink:#1f2328;--mut:#6b7280;--line:#e5e7eb;--top:#122b63;--ok:#2e9d5b;--ok-soft:#e5f5ec;--warn:#b77d00;--warn-soft:#fff5d6;--bad:#d64545;--bad-soft:#fde8e8;--info:#2f7fc1;--info-soft:#e6f0fa}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
input,select,textarea,button{font-family:inherit}
.top{position:sticky;top:0;z-index:30;height:48px;background:linear-gradient(90deg,color-mix(in srgb,var(--top) 80%,#000),var(--top) 55%,color-mix(in srgb,var(--top) 80%,#fff));color:#fff;display:flex;align-items:center;gap:12px;padding:0 12px}
.ico{background:none;border:0;color:inherit;cursor:pointer;padding:6px;border-radius:6px;display:inline-flex;align-items:center}
.ico:hover{background:rgba(255,255,255,.08)}
.gsearch{flex:1;max-width:480px;margin:0 auto;position:relative}
.gsearch input{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:6px;padding:7px 12px;font-size:13px;outline:none}
.gsr{position:absolute;top:36px;left:0;right:0;background:#fff;color:var(--ink);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:none;max-height:380px;overflow:auto}
.gsr.on{display:block}
.gsr a{display:block;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.gsr a:hover{background:var(--acc-soft)}
.gsr small{color:var(--mut);display:block}
.gsr .gh{font-size:11px;color:var(--mut);padding:8px 12px 4px;text-transform:uppercase;letter-spacing:.05em}
.user{display:flex;align-items:center;gap:8px;font-size:12px;white-space:nowrap}
.user b{display:block}
.user small{color:#b9bcc4}
.av{width:30px;height:30px;border-radius:50%;background:var(--acc);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.av.xl{width:84px;height:84px;font-size:28px}
.av.lg{width:44px;height:44px;font-size:16px}
.av.sm{width:22px;height:22px;font-size:10px}
.avfoto{object-fit:cover}
.evav{width:16px;height:16px;border-radius:50%;object-fit:cover;vertical-align:-3px;margin-right:3px;flex:none}
.drawer{position:fixed;top:0;left:0;bottom:0;width:250px;background:#fff;z-index:50;transform:translateX(-100%);transition:transform .2s;display:flex;flex-direction:column;box-shadow:2px 0 12px rgba(0,0,0,.15)}
.drawer.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none}
.scrim.open{display:block}
.brand{padding:18px 16px 4px}.brand img{max-width:170px;max-height:80px;display:block}.brand.escuro{background:#05060a;margin:12px 12px 8px;border-radius:12px;padding:10px}.brand.escuro img{max-width:100%;margin:0 auto}.prod{padding:0 16px 6px;font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.04em}
.plan{margin:0 16px 10px;display:inline-block;background:var(--navy);color:#fff;border-radius:12px;font-size:11px;padding:2px 10px;align-self:flex-start}
.menu{flex:1;overflow:auto;padding:4px 0}
.menu button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:10px 16px;font-size:14px;cursor:pointer;color:var(--ink)}
.menu button:hover{background:var(--acc-soft)}
.menu button.on{color:var(--acc);font-weight:600;background:var(--acc-soft)}
.msec{font-size:11px;color:var(--mut);padding:8px 16px 4px;letter-spacing:.08em}
.mfoot{border-top:1px solid var(--line)}
.page{padding:20px 24px;max-width:1440px;margin:0 auto}
h1{font-size:22px;margin:0}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:16px;margin:0 0 14px}
.sub{color:var(--mut);font-size:13px;margin:4px 0 0}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card{background:var(--card);border-radius:14px;border:1px solid var(--line);padding:16px}

.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{filter:brightness(.95)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}

.btn.green{background:var(--ok)}

.lnk{color:var(--acc);cursor:pointer;font-weight:500;background:none;border:0;padding:0;font-size:inherit;text-align:left}
.lnk:hover{text-decoration:underline}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);background:#fff;overflow-x:auto;padding:0 12px}
.tabs button{background:none;border:0;padding:13px 12px;cursor:pointer;font-size:13px;color:var(--ink);white-space:nowrap;border-bottom:2px solid transparent}
.tabs button.on{color:var(--acc);border-color:var(--acc);font-weight:600}
.seg{display:inline-flex;background:#f1f1f1;border-radius:8px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--mut);font-size:12px;padding:10px;border-bottom:1px solid var(--line);background:#fafafa;white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:#f5f8ff}
.tbl.dark th{background:var(--top);color:#fff}
.tbl.mini{font-size:12px;margin-top:10px}
.tbl.mini td,.tbl.mini th{padding:6px 8px}
.num{text-align:right;white-space:nowrap}
.tbl th.num{text-align:right}
a.btn{text-decoration:none}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-info{background:var(--info-soft);color:var(--info)}
.b-mut{background:#eee;color:#666}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.g2{grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}
.tile{background:#fff;border-radius:14px;padding:18px;cursor:pointer;border:1px solid var(--line);transition:box-shadow .15s}
.tile:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.tile .ti{width:36px;height:36px;border-radius:8px;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.tile b{display:block;margin-bottom:6px}
.tile p{margin:0;color:var(--mut);font-size:12px;line-height:1.4}
.tile .cnt{float:right;font-size:12px;color:var(--mut)}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.kpi b{display:block;font-size:22px;margin:6px 0 2px}
.kpi span{color:var(--mut);font-size:12px}
.kpi.g b{color:var(--ok)}.kpi.r b{color:var(--bad)}
.filters{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.filters label,.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
.filters input,.filters select,.fgrid input,.fgrid select,.fgrid textarea,.inp{border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:13px;color:var(--ink);background:#fff;outline:none}
.filters input:focus,.fgrid input:focus,.fgrid select:focus,.fgrid textarea:focus,.inp:focus{border-color:var(--acc)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.fhint{font-size:11.5px;line-height:1.5;color:var(--mut);background:#f6f8fb;border:1px solid var(--line);border-radius:6px;padding:7px 9px;margin-top:3px}
.fhint b.ok{color:#15803d}
.fhint b.novo{color:#b45309}
.fhint .lnk{font-size:11.5px;margin-right:8px}
.fgrid input[type=color]{width:96px;height:40px;padding:3px;cursor:pointer}.fgrid input[type=color]::-webkit-color-swatch-wrapper{padding:0}.fgrid input[type=color]::-webkit-color-swatch{border:0;border-radius:5px}
.modalw{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:640px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2b2d33;color:#fff;padding:10px 16px;border-radius:8px;z-index:80;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);gap:12px}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--ink);font-weight:500}
.row span:last-child{color:var(--mut);text-align:right}
.phd{background:#fff;padding:18px 24px 0;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.phd h1 small{color:var(--mut);font-weight:400}
.pgrid{display:grid;grid-template-columns:minmax(280px,1fr) minmax(280px,1fr) minmax(280px,1fr);gap:16px}
.pgrid .span2{grid-column:span 2}
.mini-empty{border:1px dashed var(--line);border-radius:8px;padding:16px;color:var(--mut);font-size:13px;text-align:center;margin-bottom:12px}
.bars{display:flex;gap:18px;align-items:flex-end;height:150px;padding:8px 4px 0;border-bottom:1px solid var(--line)}
.bgrp{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.bcols{flex:1;display:flex;gap:4px;align-items:flex-end;width:100%;justify-content:center}
.bcol{width:100%;max-width:28px;border-radius:3px 3px 0 0;min-height:1px}
.blab{font-size:11px;color:var(--mut);padding:4px 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.ag{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 48px)}
.agside{background:#fff;border-right:1px solid var(--line);padding:14px;overflow:auto}
.agmain{display:flex;flex-direction:column;min-width:0}
.agbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.agbar .ttl{font-weight:700;font-size:15px;flex:1;text-align:right}
.agscroll{overflow:auto;flex:1;background:#fff}
.agrid{display:grid;min-width:720px}
.aghead{position:sticky;top:0;background:#fff;z-index:5;border-bottom:1px solid var(--line);text-align:center;font-size:12px;padding:6px 2px;color:var(--mut)}
.aghead.today{background:var(--acc);color:#fff;font-weight:600}
.agtime{position:relative;font-size:11px;color:var(--mut);text-align:right;padding-right:6px}
.agtime div{position:absolute;right:6px;transform:translateY(-6px)}.agtime div:first-child{transform:none}
.agcol{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,#fff 0,#fff 31px,#f1f1f1 31px,#f1f1f1 32px);cursor:copy}
.agcol:hover{background:repeating-linear-gradient(to bottom,#fcfdff 0,#fcfdff 31px,#eef2f8 31px,#eef2f8 32px)}
.agmarca{position:absolute;left:2px;right:2px;height:30px;border:1px dashed var(--acc);border-radius:4px;background:rgba(39,99,215,.08);pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--acc)}
.agcol.wk{background-color:#fafafa}
.ev{position:absolute;background:#e3ebfd;border-left:3px solid var(--acc);border-radius:3px;padding:2px 5px;font-size:11px;overflow:hidden;cursor:pointer;line-height:1.25;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ev b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.ev span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#33476b}
.ev.falta{background:#fde8e8;border-left-color:var(--bad)}.ev.agd{background:#fff3bf;border-left:4px solid #e0a800}.ev.conf{background:#c9f2d6;border-left:4px solid #16a34a}.ev.novo{background:#00e5d4;border-left:4px solid #00897f;color:#003a36}.ev.novo span{color:#004d47}.ev.ok{background:#e6ebf3!important;border-left-color:#64748b!important;color:#475569}.evdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}.evtag{font-style:normal;font-size:8.5px;font-weight:800;background:#003a36;color:#fff;border-radius:3px;padding:0 4px;margin-right:4px;vertical-align:middle}.evtag.ok{background:#16a34a}.leg{display:flex;align-items:center;gap:8px;font-size:12px;margin:5px 0}.leg i{width:14px;height:14px;border-radius:3px;display:inline-block}
.ev.desm{background:repeating-linear-gradient(135deg,rgba(150,150,150,.12) 0 6px,rgba(150,150,150,.03) 6px 12px);border:1px dashed #b3b3b3;border-left:3px dashed #999;color:#8a8a8a;box-shadow:none;opacity:.5;z-index:0}.ev.desm b{text-decoration:line-through;font-weight:600}.ev.desm span{color:#9a9a9a}.ev.desm:hover{opacity:.95}.ev:not(.desm){z-index:1}
.ev.ok{background:#e5f5ec;border-left-color:var(--ok)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--acc);z-index:3}
.pchk{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:4px;cursor:pointer;font-size:12px}
.pchk i{width:12px;height:12px;border-radius:2px;flex:none}
.pchk.off{opacity:.4}
.side-h{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 6px}
.ret{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:5px 0;border-bottom:1px solid var(--line);gap:6px}
.wa{color:#25a244;display:inline-flex;vertical-align:middle}
.drop{border:2px dashed #a9bdf3;background:#f7f9ff;border-radius:10px;padding:30px;text-align:center;color:var(--mut)}
.drop input{margin-top:12px}.agleg{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:12.5px;font-weight:600;color:#3b4456;margin:0 8px}.agleg span{display:flex;align-items:center;gap:4px;white-space:nowrap}.agleg i{width:15px;height:15px;border-radius:4px;border-left:4px solid;display:inline-block}.refr{color:#cfd6e8;margin-right:6px;padding:4px;border-radius:8px;background:transparent;border:0;cursor:pointer}.refr:hover{background:rgba(255,255,255,.12)}.refr.gira svg{animation:gira .8s linear infinite}.avfoto{object-fit:cover;cursor:pointer;padding:0}.fmini{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.fmini img{width:78px;height:78px;object-fit:cover;border-radius:8px;cursor:zoom-in;border:1px solid var(--line)}.fadd{width:78px;height:78px;border:2px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mut);font-size:11px;cursor:pointer}.fadd:hover{border-color:var(--acc);color:var(--acc)}#atuFaixa{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9998;background:#0b0d12;color:#fff;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.35);padding:12px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 32px);font-size:14px}#atuFaixa span{display:flex;align-items:center;gap:8px}#avisos{position:fixed;top:64px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:10px;max-width:360px;width:calc(100% - 32px)}.aviso{background:#fff;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.28);border-left:6px solid var(--acc);padding:14px 16px;animation:avisoEntra .35s ease}.aviso-t{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.03em}.aviso-n{font-size:17px;font-weight:800;margin:6px 0 2px}.aviso-d{font-size:13px;color:#444}.aviso-b{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}@keyframes avisoEntra{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}.drop.over{border-color:var(--acc);background:#eaf1ff}.spin{width:34px;height:34px;border:4px solid #c9d6f5;border-top-color:var(--acc);border-radius:50%;margin:0 auto;animation:gira 0.9s linear infinite}@keyframes gira{to{transform:rotate(360deg)}}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.steps span{background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--mut)}
.steps span.on{border-color:var(--acc);color:var(--acc);font-weight:600}
.note{background:var(--info-soft);color:#24557f;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.45;margin-bottom:14px}
.note.warn{background:var(--warn-soft);color:#6b4d00}
.qa{display:grid;grid-template-columns:minmax(160px,35%) 1fr;border-top:1px solid var(--line)}
.qa div{padding:7px 8px;border-bottom:1px solid var(--line);font-size:13px}
.qa div:nth-child(odd){color:var(--mut);background:#fafafa}
.rlist button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--ink)}
.rlist button:hover{background:var(--acc-soft)}
.rlist button.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.rgrp{font-size:12px;font-weight:700;color:var(--mut);margin:12px 10px 4px;text-transform:uppercase;letter-spacing:.05em}
.split{display:grid;grid-template-columns:260px 1fr;gap:16px}
.dayrow{border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:10px}
.dayrow summary{list-style:none;display:grid;grid-template-columns:120px repeat(3,1fr) 20px;gap:10px;align-items:center;padding:12px 16px;cursor:pointer}
.dayrow summary::-webkit-details-marker{display:none}
.dayrow .dn b{font-size:20px;display:block}
.dayrow .dn small{color:var(--mut)}
.dayrow .kv small{display:block;color:var(--mut);font-size:10px;text-transform:uppercase}
.pager{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 0;font-size:12px;color:var(--mut);flex-wrap:wrap;gap:8px}
.pager button{border:1px solid var(--line);background:#fff;border-radius:4px;padding:3px 9px;cursor:pointer}
.color-dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px}
.sync{font-size:12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:#d6def5}.sync i{width:8px;height:8px;border-radius:50%;display:inline-block}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(700px 400px at 70% 20%,rgba(11,108,242,.45),transparent 70%),#05060a}
.authbox{background:#fff;border-radius:18px;width:100%;max-width:460px;padding:30px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.authbox .ast{font-weight:700;font-size:13px;color:var(--mut);margin:16px 0 8px}
.aopt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--bd);border-radius:12px;padding:12px 14px;background:#fff;margin-bottom:8px;cursor:pointer}
.aopt:hover{border-color:var(--acc)}.aopt.on{border-color:var(--acc);background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--acc)}
.aopt b{display:block;font-size:14px}.aopt small{color:var(--mut);display:block;line-height:1.35}
.aopt .pr{margin-left:auto;font-weight:800;white-space:nowrap}
.aresumo{border-radius:12px;background:var(--acc-soft);padding:12px 14px;margin:14px 0 4px;font-size:14px}
.authbox .lg{display:flex;justify-content:center;background:#05060a;border-radius:14px;padding:10px;margin-bottom:22px}.authbox .lg img.l{max-width:100%;max-height:150px}
.authbox label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut);margin-bottom:12px}.authbox input{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;outline:none}.authbox input:focus{border-color:var(--acc)}
.authbox .btn{width:100%;justify-content:center;padding:11px}.authmsg{font-size:13px;margin:10px 0;min-height:18px}.authmsg.err{color:var(--bad)}.authmsg.ok{color:var(--ok)}
.authlinks{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:13px;flex-wrap:wrap}
.hero{display:flex;align-items:center;gap:22px;margin-bottom:26px}.hero img{width:96px;height:96px;flex:none}
.conf-a{color:var(--ok);font-weight:700}.conf-m{color:var(--warn);font-weight:700}.conf-b{color:var(--bad);font-weight:700}
.agc{max-width:640px;margin:0 auto}
.agc-top{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.agc-dia{flex:1;display:flex;align-items:center;gap:10px;background:var(--card,#fff);border:1px solid var(--line,#e5e7eb);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;color:inherit;font:inherit}
.agc-dia span{flex:1;display:flex;flex-direction:column;line-height:1.2}.agc-dia b{font-size:17px}.agc-dia small{color:var(--mut);font-size:13px}.agc-dia em{font-style:normal;font-size:12px;color:var(--acc,#0b6cf2);font-weight:700}
.agc-n{font-size:12px;color:var(--mut);margin:6px 2px}
.agc-it{width:100%;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line,#e5e7eb);border-left:5px solid #e0a800;border-radius:10px;padding:10px 12px;margin-bottom:8px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.agc-h{font-weight:800;font-size:15px;min-width:46px}.agc-x{flex:1;min-width:0;display:flex;flex-direction:column}.agc-x b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.agc-x small{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agc-st{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:#fff3bf;color:#7a5c00;white-space:nowrap}
.agc-it.conf{border-left-color:#16a34a}.agc-it.conf .agc-st{background:#c9f2d6;color:#14532d}
.agc-it.novo{border-left-color:#00897f}.agc-it.novo .agc-st{background:#00e5d4;color:#003a36}
.agc-it.ok{border-left-color:#64748b}.agc-it.ok .agc-st{background:#e6ebf3;color:#475569}
.agc-it.falta{border-left-color:#dc2626}.agc-it.falta .agc-st{background:#fde8e8;color:#991b1b}
.agc-it.desm{border-left:4px dashed #999;opacity:.5;background:transparent}.agc-it.desm b{text-decoration:line-through}.agc-it.desm .agc-st{background:#eee;color:#555}
.agc-vazio{text-align:center;color:var(--mut);padding:40px 10px;background:#fff;border:1px dashed var(--line,#e5e7eb);border-radius:12px}
.agc-lista{max-height:55vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.agc-op{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;border:1px solid var(--line,#e5e7eb);border-radius:10px;background:#fff;text-align:left;cursor:pointer;font:inherit;color:inherit}
.agc-op.on{border-color:var(--acc,#0b6cf2);background:#eef4ff}.agc-op small{color:var(--mut)}
@media (max-width:900px){
 .pgrid{grid-template-columns:1fr}.pgrid .span2{grid-column:auto}
 .ag{grid-template-columns:1fr}.agside{display:none}
 .split{grid-template-columns:1fr}
 .g2{grid-template-columns:1fr}
 .fgrid{grid-template-columns:1fr}
 .user div{display:none}
 .page{padding:16px}
 .dayrow summary{grid-template-columns:80px repeat(3,1fr) 16px;padding:10px}
}
@media print{.top,.drawer,.scrim,.btn,.tabs{display:none!important}body{background:#fff}}
.olhoW{position:relative;display:block;width:100%}.olhoW input{width:100%;padding-right:44px!important}.olhoB{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;color:inherit;opacity:.65;padding:6px;line-height:0}.olhoB:hover{opacity:1}
.dtW{position:relative;display:flex;align-items:center;width:100%}.dtW .dtT{width:100%;padding-right:38px!important}.dtW input[type=date]{position:absolute;right:6px;bottom:0;width:28px;height:100%;opacity:0;pointer-events:none;border:0;padding:0}.dtW .dtB{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;padding:5px;line-height:0;cursor:pointer;color:inherit;opacity:.7}.dtW .dtB:hover{opacity:1}.dtErr{border-color:#dc2626!important;outline-color:#dc2626!important}
.rsW{position:relative;display:flex;align-items:center;width:100%}.rsW:has(>input[style*="width"]){display:inline-flex;width:auto}.rsW>input{width:100%;padding-left:36px!important}.rsW .rsP{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:.92em;opacity:.7;pointer-events:none}
</style>

/* ============ Utilidades ============ */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const money=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const str=v=>String(v??'').trim();
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
const todayISO=()=>iso(new Date());
function addDays(isoStr,n){const d=new Date(isoStr+'T00:00');d.setDate(d.getDate()+n);return iso(d)}
function br(d){if(!d)return '-';const p=d.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d}
function diffDays(a,b){return Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/86400000)}
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DIAS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
function monthLabel(k){const [y,m]=k.split('-');return MESES[+m-1]+'/'+y.slice(2)}
function initials(n){return String(n||'?').trim().split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?'}
function age(d){if(!d)return '';const b=new Date(d+'T00:00'),t=new Date();let a=t.getFullYear()-b.getFullYear();const m=t.getMonth()-b.getMonth();if(m<0||(m===0&&t.getDate()<b.getDate()))a--;return isNaN(a)?'':a}
function onlyDigits(v){return String(v??'').replace(/\D/g,'')}
function fmtCPF(c){const d=onlyDigits(c);if(!d)return '';const x=d.padStart(11,'0');return d.length<=11?`${x.slice(0,3)}.${x.slice(3,6)}.${x.slice(6,9)}-${x.slice(9)}`:c}
function keyCPF(c){const d=onlyDigits(c);return d.length>=9&&d.length<=11?d.padStart(11,'0'):''}
function waLink(p,msg){let d=onlyDigits(p);if(d.length<10)return '';if(!d.startsWith('55')||d.length<=11)d='55'+d;return `https://wa.me/${d}${msg?'?text='+encodeURIComponent(msg):''}`}
/* ============ Formato dos campos: telefone, CPF, CNPJ, CEP e dinheiro ============
   Telefone sai como (47) 99999-9999, CEP como 89251-000, CPF como
   123.456.789-00. Dinheiro e formatado quando a pessoa sai do campo, para nao
   atrapalhar quem digita. */
function soDig(v){return String(v==null?'':v).replace(/\D/g,'')}
function mascFone(v){const d=soDig(v).slice(0,11);

const FT={db:null,urls:{},enviando:false,erroNuvem:'',pend:0,

 async op(store,mode,fn){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction(store,mode);const q=fn(tx.objectStore(store));let v;if(q)q.onsuccess=()=>{v=q.result};tx.oncomplete=()=>res(v);tx.onerror=()=>rej(tx.error)})},
 get(id){return this.op('img','readonly',s=>s.get(id)).catch(()=>null)},

 del(id){return this.op('img','readwrite',s=>s.delete(id)).catch(()=>{})},

function arqInfo(id){const d=(S.documentos||[]).find(x=>x.id===id);

function canvasDe(img,lado){const k=Math.min(1,lado/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);return c}

function u16(d,o){return d[o]|(d[o+1]<<8)}

  if(it.met===8&&window.DecompressionStream){const s=new Blob([bruto]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return new Uint8Array(await new Response(s).arrayBuffer())}
  throw new Error('Formato de compressão não suportado')}}}

    try{const bytes=await zip.dados(it);const blob=new Blob([bytes],{type:'image/jpeg'});const {cheia,thumb}=await fotoPreparar(blob,true);
     await fotoGuardar(id,cheia);S.fotos.push({id,pacienteId:p.id,data:String(data).slice(0,10),area:'Clinicorp',momento:'',obs:m.original&&!/^U2FsdGVk/.test(m.original)?'Arquivo original: '+m.original:'',thumb,arq:1,origem:'clinicorp'});ja.add(id);novas++;

  S.importacoes.unshift({id:uid(),data:new Date().toISOString(),tipo:'Fotos do Clinicorp',arquivo:arqs.map(a=>a.name).join(', '),modo:'acrescentar',lidas:z.total,importadas:novas,atualizadas:0,ignoradas:repetidas+semPac+erros,criados:0});
  save()}
 catch(e){erros++;console.error(e);toast('Erro ao ler as fotos: '+String(e.message||e))}
 z.lendo=false;z.res=`${novas} fotos importadas${repetidas?', '+repetidas+' já existiam':''}${semPac?', '+semPac+' de '+faltam.size+' pacientes não encontrados no cadastro':''}${erros?', '+erros+' com erro':''}.`;
 render();toast(novas+' fotos importadas');filaEnviar()}

const PALETA=['#0a4bde','#254775','#1f9e9e','#c9862b','#2e9d5b','#9c6ade','#d64545','#5b7fd6','#b5527a','#7a8ca3'];
function ensureProf(nome){nome=str(nome);if(!nome)return '';let p=S.profissionais.find(x=>norm(x.nome)===norm(nome));if(!p){p={id:uid(),nome,cor:PALETA[S.profissionais.length%PALETA.length],ativo:true};S.profissionais.push(p)}return p.nome}
function profColor(n){const p=S.profissionais.find(x=>norm(x.nome)===norm(n));return p?p.cor:'#0a4bde'}
function nextCodigo(){let m=0;S.pacientes.forEach(p=>{const n=parseInt(p.codigo,10);if(n>m)m=n});return String(m+1)}
function findPatient(nome,cpf,codigo){const k=keyCPF(cpf);if(k){const p=S.pacientes.find(p=>keyCPF(p.cpf)===k);if(p)return p}
 if(codigo){const p=S.pacientes.find(p=>String(p.codigo)===String(codigo)&&norm(p.nome)===norm(nome));if(p)return p}
 const n=norm(nome);if(!n)return null;return S.pacientes.find(p=>norm(p.nome)===n)||null}
function ensurePatient(nomeRaw,cpf){const {nome,codigo}=splitNome(nomeRaw);let p=findPatient(nome,cpf,codigo);
 if(!p&&nome){p={id:uid(),codigo:codigo||nextCodigo(),nome,cpf:str(cpf),status:'Ativo',criadoPorImportacao:true};S.pacientes.push(p)}return p}
const pac=id=>S.pacientes.find(p=>p.id===id);
/* ---- Apoio para digitar o nome do paciente em qualquer tela ---- */
function acharPac(v){const {nome,codigo}=splitNome(v||'');return nome?findPatient(nome,'',codigo):null}
function levCurto(a,b){const n=a.length,m=b.length;if(Math.abs(n-m)>2)return 9;
 let ant=Array.from({length:m+1},(_,j)=>j);
 for(let i=1;i<=n;i++){const at=[i];let min=i;
  for(let j=1;j<=m;j++){const c=Math.min(ant[j]+1,at[j-1]+1,ant[j-1]+(a[i-1]===b[j-1]?0:1));at[j]=c;if(c<min)min=c}
  if(min>2)return 9;ant=at}
 return ant[m]}
/* Nomes parecidos ja cadastrados, para o erro de digitacao nao virar cadastro repetido.
   Serve para paciente e para produto: muda so a lista que entra. */
function pacParecidos(v,lim){return nomesParecidos(S.pacientes,v,lim)}
function nomesParecidos(lista,v,lim){const n=norm(splitNome(v||'').nome);if(n.length<3)return [];
 const toks=n.split(' ').filter(x=>x.length>2);const out=[];
 for(const p of (lista||[])){const q=norm(p.nome);if(!q||q===n)continue;
  let s=0;
  if(q.indexOf(n)>=0||n.indexOf(q)>=0)s=4;
  else{const qt=q.split(' ');const c=toks.filter(t=>qt.some(x=>x===t||(x.length>3&&t.length>3&&(x.indexOf(t)===0||t.indexOf(x)===0))));
   if(c.length)s=c.length;else if(levCurto(n,q)<=2)s=1}
  if(s)out.push({p,s});if(out.length>400)break}
 return out.sort((a,b)=>b.s-a.s).slice(0,lim||4).map(x=>x.p)}
/* O campo de celular so aparece quando serve para alguma coisa:
   paciente novo, ou paciente ja cadastrado que esta sem celular. */
function pacPedeCelular(v){const nome=splitNome(v||'').nome;if(!nome||nome.length<3)return false;
 const p=acharPac(v);return !p||!str(p.celular)}
/* CPF e nascimento: s\u00f3 aparecem quando a ficha ainda n\u00e3o tem. O CPF \u00e9 o que
   casa o paciente com a planilha do Clinicorp na confer\u00eancia do financeiro. */
function pacPedeCPF(v){const nome=splitNome(v||'').nome;if(!nome||nome.length<3)return false;
 const p=acharPac(v);return !p||!str(p.cpf)}
/* Endere\u00e7o e trabalho: aparecem quando a ficha ainda n\u00e3o tem.
   Sem endere\u00e7o e sem CPF n\u00e3o se protesta nem se executa quem n\u00e3o paga. */
function pacPedeEndereco(v){const nome=splitNome(v||'').nome;if(!nome||nome.length<3)return false;
 const p=acharPac(v);return !p||!str(p.endereco)||!str(p.cep)}
function pacPedeTrabalho(v){const nome=splitNome(v||'').nome;if(!nome||nome.length<3)return false;
 const p=acharPac(v);return !p||(!str(p.profissao)&&!str(p.empresa))}
/* Endere\u00e7o em uma linha, do jeito que se escreve em peti\u00e7\u00e3o. */
/* Dados de cadastro que o agendamento tamb\u00e9m aproveita. */
function fmtCEP(v){const c=str(v).replace(/\D/g,'');return c.length===8?c.replace(/(\d{5})(\d{3})/,'$1-$2'):str(v)}
function fichaDe(p){const o={};['cep','endereco','numero','bairro','cidade','uf','profissao','empresa'].forEach(k=>o[k]=p?str(p[k]):'');return o}
function enderecoDe(p){if(!p)return '';
 const rua=[str(p.endereco),str(p.numero)].filter(Boolean).join(', ');
 const cid=[str(p.cidade),str(p.uf)].filter(Boolean).join('/');
 return [rua,str(p.complemento),str(p.bairro),cid,str(p.cep)].filter(Boolean).join(' \u00b7 ')}
/* Quantas anamneses a pessoa tem e quando foi a \u00faltima. */
function resumoAnamnese(p){if(!p)return '';
 const L=S.anamneses.filter(a=>a.pacienteId===p.id).sort((a,b)=>str(b.data).localeCompare(str(a.data)));
 return L.length?'anamnese de '+br(L[0].data)+(L.length>1?' e mais '+(L.length-1):''):'sem anamnese'}
function avisoPaciente(v){const nome=splitNome(v||'').nome;
 /* Campo vazio: explica que os campos de cadastro aparecem conforme o nome,
    sen\u00e3o parece que a tela n\u00e3o tem nada. */
 if(!nome)return `Digite o nome. Se a pessoa j\u00e1 estiver cadastrada, aparecem aqui a foto, o CPF, o endere\u00e7o e a anamnese dela. Se n\u00e3o estiver, o sistema abre os campos de celular, CPF, nascimento, endere\u00e7o, profiss\u00e3o e empresa para cadastrar na hora.`;
 if(nome.length<3)return 'Continue digitando o nome.';
 const p=acharPac(v);
 if(p){const cel=str(p.celular)?' \u00b7 '+esc(p.celular):'';
  const falta=str(p.celular)?'':' Est\u00e1 sem celular na ficha; se preencher abaixo, fica salvo no cadastro.';

   +(str(p.cpf)||enderecoDe(p)?`<div style="margin-top:3px">${str(p.cpf)?'CPF '+esc(fmtCPF(p.cpf)):''}${str(p.cpf)&&enderecoDe(p)?' \u00b7 ':''}${esc(enderecoDe(p))}</div>`:'')

   +`</div></div></div>`}
 if(nome.length<3)return '';
 const par=pacParecidos(v,4);
 return `<b class="novo">${esc(SEG().pessoa)} novo</b> Esse nome n\u00e3o est\u00e1 no cadastro. Ao salvar, o sistema cria a ficha com o nome e o celular informados.`

function stLanc(l){const s=norm(l.statusOrig);if(/cancel|estorn/.test(s))return 'Cancelado';if(s==='previsto'&&!l.pagamento&&!(l.valorPago>0))return 'Previsto';
 const aberto=/(nao|n o) pag|aberto|pendente|parcial|a receber|vencid|atras/.test(s);
 const pagoTxt=!aberto&&/(^| )(pago|paga|quitad|recebid|baixad|liquidad|confirmad)/.test(s);
 if(pagoTxt||(!aberto&&l.pagamento)||(l.valor>0&&l.valorPago>=l.valor-0.005))return 'Pago';
 if(l.vencimento&&l.vencimento<todayISO())return 'Em atraso';return 'A vencer'}
function pagoEf(l){const st=stLanc(l);if(st==='Cancelado')return 0;if(Array.isArray(l.pagamentos))return r2(l.pagamentos.reduce((a,x)=>a+(Number(x.valor)||0),0));if(st==='Pago')return l.valorPago||l.valor||0;return l.valorPago||0}
function saldoL(l){return ['Cancelado','Previsto'].includes(stLanc(l))?0:Math.max(0,(l.valor||0)-pagoEf(l))}
function stConta(c){const s=norm(c.statusOrig);if(/cancel/.test(s))return 'Cancelado';const ab=/aberto|pendente|a pagar|nao pag/.test(s);
 if((!ab&&(c.pagamento||/(^| )(pago|paga|quitad|baixad|liquidad)/.test(s)))||(c.valor>0&&c.valorPago>=c.valor-0.005))return 'Pago';
 if(c.vencimento&&c.vencimento<todayISO())return 'Em atraso';return 'A vencer'}
function stTrat(t){const s=norm(t.statusOrig);if(/conclu|finaliz|executad/.test(s))return 'Concluído';if(/reprov|recus|cancel|perdid/.test(s))return 'Reprovado';
 if(/follow/.test(s))return 'Em follow up';if(/aberto|pendente|aguard|negocia/.test(s))return 'Em aberto';
 if((t.sessoesTotal||0)>0&&(t.sessoesRealizadas||0)>=t.sessoesTotal)return 'Concluído';return 'Aprovado'}
function stAg(a){const s=norm(a.status);if(/falt|nao compareceu|ausen/.test(s))return 'Faltou';if(/desmarc|cancel|remarc/.test(s))return 'Desmarcado';
 if(/atendid|conclu|finaliz|realizad/.test(s))return 'Atendido';if(/confirm/.test(s))return 'Confirmado';return 'Agendado'}

 if(P.length)P.forEach(x=>{const v=Number(x.valor)||0;if(v>0.004)out.push({data:x.data||l.vencimento,valor:r2(v),l,pg:x})});

function lastApptMap(){const m={};const t=todayISO();S.agendamentos.forEach(a=>{const sa=stAg(a);if(sa==='Desmarcado'||(sa==='Faltou'&&a.data<=t))return;const o=m[a.pacienteId]||(m[a.pacienteId]={last:'',next:''});if(a.data<=t){if(a.data>o.last)o.last=a.data}else{if(!o.next||a.data<o.next)o.next=a.data}});return m}
function retornoList(){const m=lastApptMap(),t=todayISO(),lim=Number(S.config.diasRetorno)||90;return S.pacientes.filter(p=>p.status!=='Inativo').map(p=>({p,o:m[p.id]})).filter(x=>x.o&&x.o.last&&!x.o.next&&diffDays(x.o.last,t)>=lim).map(x=>({p:x.p,last:x.o.last,dias:diffDays(x.o.last,t)})).sort((a,b)=>a.dias-b.dias)}
function inadList(){const t=todayISO();const g={};S.lancamentos.forEach(l=>{if(stLanc(l)!=='Em atraso')return;const s=saldoL(l);if(s<=0)return;const o=g[l.pacienteId]||(g[l.pacienteId]={pacienteId:l.pacienteId,qtd:0,valor:0,maisAntigo:l.vencimento});o.qtd++;o.valor+=s;if(l.vencimento<o.maisAntigo)o.maisAntigo=l.vencimento});
 return Object.values(g).map(o=>({...o,p:pac(o.pacienteId),dias:diffDays(o.maisAntigo,t),totalAberto:S.lancamentos.filter(l=>l.pacienteId===o.pacienteId).reduce((a,l)=>a+saldoL(l),0)})).filter(o=>o.p).sort((a,b)=>b.valor-a.valor)}

function vchCodigo(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c;do{c='BF-';for(let i=0;i<6;i++)c+=A[Math.floor(Math.random()*A.length)]}while(S.vouchers.some(v=>v.codigo===c));return c}

/* ============ Cobrança por Pix (QR Code e copia e cola) ============ */
function pixTxt(s,max){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 .\-]/g,'').trim().toUpperCase().slice(0,max)}
function pixCampo(id,v){v=String(v);return id+String(v.length).padStart(2,'0')+v}
function pixCRC(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function cpfOk(d){if(d.length!==11||/^(\d)\1+$/.test(d))return false;const dv=n=>{let s=0;for(let i=0;i<n;i++)s+=+d[i]*(n+1-i);const r=s*10%11;return r===10?0:r};return dv(9)===+d[9]&&dv(10)===+d[10]}
function pixChaveNorm(k){k=String(k||'').trim();if(/@/.test(k))return k.toLowerCase();if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(k))return k.toLowerCase();const d=k.replace(/\D/g,'');if(k.startsWith('+'))return '+'+d;if(d.length===14)return d;if(d.length===11&&cpfOk(d))return d;if(d.length===10||d.length===11)return '+55'+d;if(d.length===12||d.length===13)return '+'+d;return k}
function pixCodigo(valor,txid){const c=S.config;const chave=pixChaveNorm(c.pixChave);
 const conta=pixCampo('00','br.gov.bcb.pix')+pixCampo('01',chave);
 let p=pixCampo('00','01')+pixCampo('26',conta)+pixCampo('52','0000')+pixCampo('53','986')+(valor>0?pixCampo('54',(+valor).toFixed(2)):'')+pixCampo('58','BR')+pixCampo('59',pixTxt(c.pixNome||c.clinica,25)||'RECEBEDOR')+pixCampo('60',pixTxt(c.pixCidade,15)||'CIDADE')+pixCampo('62',pixCampo('05',(String(txid||'').replace(/[^A-Za-z0-9]/g,'').slice(0,25))||'***'))+'6304';
 return p+pixCRC(p)}
function pixQR(txt){try{if(typeof qrcode!=='function')return '';const q=qrcode(0,'M');q.addData(txt);q.make();return q.createDataURL(6,12)}catch(e){return ''}}
function cobrarPix(lid){const l=S.lancamentos.find(x=>x.id===lid);if(!l)return;if(!S.config.pixChave){openModal(`<h3>Cobrança por Pix</h3><p>Para gerar o QR Code, cadastre antes a chave Pix da clínica em <b>Configurações</b>, no quadro <b>Pix da clínica</b>.</p><div class="mact"><button class="btn ghost" onclick="closeModal()">Fechar</button><button class="btn" onclick="closeModal();go('config')">Ir para Configurações</button></div>`);return}
 const p=pac(l.pacienteId);const val=saldoL(l)||+l.valor||0;const cod=pixCodigo(val,'BF'+String(l.id).replace(/[^A-Za-z0-9]/g,'').slice(-12));const img=pixQR(cod);
 const msg=`Olá ${firstName(p?p.nome:'')}, tudo bem? Aqui é da ${S.config.clinica}. Segue o Pix de ${money(val)} referente a ${l.descricao}${l.vencimento?', com vencimento em '+br(l.vencimento):''}.\n\nPix copia e cola:\n${cod}\n\nDepois de pagar, se puder, envie o comprovante por aqui. Obrigado!`;const wl=p?waLink(p.celular,msg):'';
 openModal(`<h3>Cobrar por Pix</h3><p class="sub">${esc(p?p.nome:'')} · ${esc(l.descricao)} · <b>${money(val)}</b></p><div style="text-align:center">${img?`<img src="${img}" style="width:240px;max-width:100%;image-rendering:pixelated">`:'<p class="sub">Não foi possível desenhar o QR Code agora. Use o copia e cola.</p>'}</div>
 <label class="full" style="display:block;margin-top:8px"><span style="font-size:12px;color:var(--mut)">Pix copia e cola</span><textarea id="pixCod" rows="3" readonly style="width:100%;font-family:monospace;font-size:12px">${esc(cod)}</textarea></label>
 <p class="sub" style="margin-top:6px">Recebedor: ${esc(S.config.pixNome||S.config.clinica)} · Chave: ${esc(S.config.pixChave)}. O pagamento cai direto na conta da clínica. Quando o valor entrar, use <b>Baixar</b> para registrar.</p>
 <div class="mact"><button class="btn ghost" onclick="const t=$('#pixCod');t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast('Código copiado'),()=>{document.execCommand('copy');toast('Código copiado')})">Copiar código</button>${wl?`<a class="btn green" href="${wl}" target="_blank" rel="noopener">${waIco()} Enviar pelo WhatsApp</a>`:''}<button class="btn" onclick="closeModal()">Fechar</button></div>`)}

function lancForm(id,pacienteId){const l=id?S.lancamentos.find(x=>x.id===id):null;const pid=l?l.pacienteId:pacienteId;const temPg=!!(l&&pagosL(l).length);
 formModal(l?'Editar lançamento':'Novo lançamento',[{k:'descricao',l:'Descrição',req:true,full:true},{k:'valor',l:temPg?'Valor total (já pago '+money(pagoEf(l))+')':'Valor',type:'number',req:true},{k:'vencimento',l:'Vencimento',type:'date',req:true},{k:'parcela',l:'Parcela (ex.: 1/3)'},
  ...(temPg?[]:[{k:'forma',l:'Forma de pagamento',type:'select',opts:['',...FORMAS_PAG]},{k:'valorPago',l:'Valor já pago',type:'dinheiro'},{k:'pagamento',l:'Data do pagamento',type:'date'},{k:'statusOrig',l:'Situação',type:'select',opts:['','Pago','Em aberto','Cancelado']}])],
  l||{vencimento:todayISO(),descricao:'Lançamento de Tratamento'},o=>{if(o.statusOrig==='Em aberto'&&!o.valorPago)o.pagamento='';if(l){Object.assign(l,o);if(temPg)lancRecalc(l)}else{const nl={id:uid(),pacienteId:pid,origem:'manual',criadoEm:todayISO(),criadoHora:new Date().toTimeString().slice(0,5),...o};lancMigra(nl);parcMigra(nl);lancRecalc(nl);S.lancamentos.push(nl)}},
  l?`<button class="btn danger" style="margin-right:auto" onclick="delRec('lancamentos','${l.id}')">Excluir</button>`:'')}
function mensalidadesForm(pid){formModal('Adicionar mensalidades',[{k:'descricao',l:'Descrição',req:true,full:true},{k:'total',l:'Valor total',type:'dinheiro',req:true},{k:'qtd',l:'Quantidade de parcelas',type:'number',req:true},{k:'per',l:'A cada quanto tempo',type:'select',opts:['Mensal','Quinzenal','Semanal']},{k:'primeiro',l:'Primeiro vencimento',type:'date',req:true},{k:'forma',l:'Forma de pagamento prevista',type:'select',opts:['',...FORMAS_PAG]},{k:'modo',l:'Como lançar',type:'select',opts:['Um lançamento com parcelas','Um lançamento para cada parcela']}],
 {descricao:'Lançamento de Tratamento',qtd:4,per:'Mensal',primeiro:todayISO(),forma:'Dinheiro'},
 o=>{const n=Math.max(1,Math.round(parseNum(o.qtd)));const total=r2(parseNum(o.total));const base=Math.floor(total/n*100)/100;
  if(o.modo==='Um lançamento para cada parcela'){for(let i=0;i<n;i++){const v=i===n-1?r2(total-base*(n-1)):base;

   toast(n+' lançamentos criados');return}
  const P=[];for(let i=0;i<n;i++)P.push({id:uid(),venc:somaPeriodo(o.primeiro,i,o.per),data:'',receb:'',valor:i===n-1?r2(total-base*(n-1)):base,forma:o.forma||'',obs:'',recibo:null,status:'Em aberto'});
  const l={id:uid(),pacienteId:pid,descricao:o.descricao,valor:total,valorPago:0,vencimento:P[0].venc,pagamento:'',forma:o.forma,parcela:n+'x',statusOrig:'',origem:'manual',criadoEm:todayISO(),criadoHora:new Date().toTimeString().slice(0,5),parcelas:P};
  lancRecalc(l);S.lancamentos.push(l);toast(n+' parcelas de '+money(base)+' criadas ('+o.per.toLowerCase()+')')})}
/* Registrar pagamento: forma, cartão à vista ou parcelado, maquininha, taxa e pagamento em outra data */
const FORMAS_PAG=['Pix','Dinheiro','Cartão de crédito','Cartão de débito','Boleto','Transferência bancária','Cheque','Link de pagamento','Carteira digital','Vale ou voucher','Crédito do paciente','Convênio ou plano','Permuta','Outra forma'];
const FORMAS_MAQ=['Cartão de crédito','Cartão de débito','Pix','Link de pagamento','Carteira digital'];
/* Pagamentos de um lançamento: a lista é a fonte da verdade; os campos antigos viram resumo */
function pagosL(l){return Array.isArray(l.pagamentos)?l.pagamentos:[]}
/* Parcelas do lançamento: cada linha é uma parcela, recebida ou em aberto. É a fonte da verdade. */
function parcL(l){if(!Array.isArray(l.parcelas))parcMigra(l);return l.parcelas}
function parcRec(x){return !!x&&x.status==='Recebido'}
function parcSt(x){if(x.status==='Recebido')return 'Recebido';if(x.status==='Cancelado')return 'Cancelado';return (x.venc&&x.venc<todayISO())?'Em atraso':'Em aberto'}
function parcMigra(l){lancMigra(l);
 const P=pagosL(l).map(x=>({id:x.id||uid(),venc:x.venc||x.data||l.vencimento||todayISO(),data:x.data||'',receb:x.receb||x.data||'',valor:r2(x.valor),forma:x.forma||'',cartaoModo:x.cartaoModo||'',cartaoParcelas:x.cartaoParcelas||'',maquininha:x.maquininha||'',bandeira:x.bandeira||'',taxa:x.taxa||'',taxaValor:x.taxaValor||'',liquido:x.liquido||'',obs:x.obs||'',recibo:x.recibo||null,status:'Recebido'}));
 const falta=r2((l.valor||0)-P.reduce((a,x)=>a+(Number(x.valor)||0),0));
 if(falta>0.004&&stLanc(l)!=='Cancelado')P.push({id:uid(),venc:l.vencimento||todayISO(),data:'',receb:'',valor:falta,forma:l.forma||'',obs:'',recibo:null,status:'Em aberto'});
 l.parcelas=P;return l}
function parcNum(l){const P=parcL(l);return {total:P.filter(x=>x.status!=='Cancelado').length,pagas:P.filter(parcRec).length}}
function parcAbertas(l){return parcL(l).filter(x=>x.status!=='Recebido'&&x.status!=='Cancelado')}
function lancMigra(l){if(Array.isArray(l.pagamentos))return l;const st=stLanc(l);const v=Number(l.valorPago)||0;const tot=(st==='Pago'&&!v)?(l.valor||0):v;
 l.pagamentos=tot>0.004?[{id:uid(),data:l.pagamento||l.vencimento||todayISO(),valor:r2(tot),forma:l.forma||'',cartaoModo:l.cartaoModo||'',cartaoParcelas:l.cartaoParcelas||'',maquininha:l.maquininha||'',bandeira:l.bandeira||'',taxa:l.taxa||'',taxaValor:l.taxaValor||'',liquido:l.liquido||'',obs:''}]:[];return l}
function lancRecalc(l){
 if(Array.isArray(l.parcelas)){const Q=l.parcelas;
  Q.sort((a,b)=>(a.venc||a.data||'').localeCompare(b.venc||b.data||''));
  l.pagamentos=Q.filter(parcRec).map(x=>({id:x.id,data:x.data||x.receb||x.venc,valor:r2(x.valor),forma:x.forma||'',cartaoModo:x.cartaoModo||'',cartaoParcelas:x.cartaoParcelas||'',maquininha:x.maquininha||'',bandeira:x.bandeira||'',taxa:x.taxa||'',taxaValor:x.taxaValor||'',liquido:x.liquido||'',obs:x.obs||'',recibo:x.recibo||null}));
  const ab=Q.filter(x=>x.status!=='Recebido'&&x.status!=='Cancelado').sort((a,b)=>(a.venc||'').localeCompare(b.venc||''));
  if(ab.length){l.vencimento=ab[0].venc||l.vencimento;l.vencManual=true}}
 const P=pagosL(l).slice().sort((a,b)=>(a.data||'').localeCompare(b.data||''));l.pagamentos=P;
 const tot=r2(P.reduce((a,x)=>a+(Number(x.valor)||0),0));l.valorPago=tot;const u=P[P.length-1];
 l.pagamento=u?u.data:'';l.forma=u?u.forma:'';l.cartaoModo=u?(u.cartaoModo||''):'';l.cartaoParcelas=u?(u.cartaoParcelas||''):'';l.maquininha=u?(u.maquininha||''):'';l.bandeira=u?(u.bandeira||''):'';l.taxa=u?(u.taxa||''):'';
 const tx=r2(P.reduce((a,x)=>a+(Number(x.taxaValor)||0),0));l.taxaValor=tx||'';l.liquido=tot?r2(tot-tx):'';
 if(l.statusOrig!=='Cancelado'&&l.statusOrig!=='Previsto'||tot>0.004){
  if(tot<=0.004)l.statusOrig=l.statusOrig==='Cancelado'?'Cancelado':(l.statusOrig==='Previsto'?'Previsto':'Em aberto');
  else if(tot>=(l.valor||0)-0.005)l.statusOrig='Pago';else l.statusOrig='Parcial'}
 return l}
function lancHist(l,compacto){const P=pagosL(l);if(!P.length)return '';
 return `<div class="tw" style="border:1px solid var(--bd);border-radius:10px;margin:0 0 12px"><table class="tbl" style="margin:0"><thead><tr><th>Data</th><th>Forma de pagamento</th><th class="num">Valor</th>${compacto?'':'<th class="num">Taxa</th><th class="num">Líquido</th>'}<th></th></tr></thead><tbody>
 ${P.map((x,i)=>`<tr><td>${br(x.data)}</td><td>${esc(formaTxt(x)||'-')}${x.obs?`<br><small style="color:var(--mut)">${esc(x.obs)}</small>`:''}</td><td class="num">${money(x.valor)}</td>${compacto?'':`<td class="num">${x.taxaValor?money(x.taxaValor):'-'}</td><td class="num">${x.liquido?money(x.liquido):'-'}</td>`}<td class="num"><button class="lnk" style="color:var(--bad)" onclick="pgExcluir('${l.id}','${x.id||i}')">Excluir</button></td></tr>`).join('')}
 </tbody></table><div style="padding:10px 14px;text-align:right;font-size:13px;background:#f8fafc;border-top:1px solid var(--bd)">${P.length} pagamento${P.length>1?'s':''} · Pago ${money(pagoEf(l))} de ${money(l.valor)} · <b style="color:${saldoL(l)>0.004?'var(--info)':'var(--ok)'}">${saldoL(l)>0.004?'falta '+money(saldoL(l)):'quitado'}</b></div></div>`}
function histLanc(id){parcelasLanc(id)}
function histLancAntigo(id){const l=S.lancamentos.find(x=>x.id===id);if(!l)return;const p=pac(l.pacienteId);
 openModal(`<h3>Pagamentos do lançamento</h3><p class="sub" style="margin-top:-4px">${esc(l.descricao||'')}${p?' · '+esc(p.nome):''}</p>${lancHist(l)||'<div class="empty">Nenhum pagamento registrado ainda.</div>'}
 <div class="mact"><button class="btn ghost" onclick="closeModal()">Fechar</button>${saldoL(l)>0.004||stLanc(l)==='Previsto'?`<button class="btn green" onclick="closeModal();baixarLanc('${l.id}')">Registrar pagamento</button>`:''}</div>`)}
function pgExcluir(lid,pid){const l=S.lancamentos.find(x=>x.id===lid);if(!l)return;const P=pagosL(l);const i=P.findIndex((x,k)=>String(x.id||k)===String(pid));if(i<0)return;const v=P[i].valor;
 confirmModal('Excluir o pagamento de '+money(v)+' de '+br(P[i].data)+'? O valor volta para o saldo em aberto.',()=>{P.splice(i,1);lancRecalc(l);closeModal();toast('Pagamento excluído. Saldo em aberto: '+money(saldoL(l)))},'Excluir pagamento')}
/* ====== Parcelas do lançamento, no formato da tela Parcelas do Clinicorp ====== */
function parcCor(st){return {'Recebido':'#16a34a','Em aberto':'#e0a800','Em atraso':'#dc2626','Cancelado':'#94a3b8'}[st]||'#94a3b8'}
function parcBolinhas(l){const P=parcL(l).filter(x=>x.status!=='Cancelado');if(!P.length)return '-';
 const pagas=P.filter(parcRec).length;
 const dots=P.slice(0,12).map((x,i)=>`<span title="Parcela ${i+1} de ${P.length}: ${parcSt(x)}, ${money(x.valor)}, vence ${br(x.venc)}" style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:${parcCor(parcSt(x))};color:#fff;font-size:11px;font-weight:700;margin-right:3px">${i+1}</span>`).join('');
 return `<div style="white-space:nowrap">${dots}${P.length>12?'<span style="font-size:11px;color:var(--mut)">+'+(P.length-12)+'</span>':''}</div><small style="color:var(--mut)">${pagas} de ${P.length} ${pagas===1?'recebida':'recebidas'}</small>`}
function parcelasLanc(id){const l=S.lancamentos.find(x=>x.id===id);if(!l)return;UI.parcAberta=id;
 const P=parcL(l),p=pac(l.pacienteId),ativos=P.filter(x=>x.status!=='Cancelado');
 const recebido=r2(P.filter(parcRec).reduce((a,x)=>a+(Number(x.valor)||0),0));
 const emAberto=r2(ativos.filter(x=>!parcRec(x)).reduce((a,x)=>a+(Number(x.valor)||0),0));
 const linhas=P.map((x,i)=>{const st=parcSt(x);const n=ativos.indexOf(x)+1;
  return `<tr><td>${x.status==='Cancelado'?'-':n}</td><td>${br(x.venc)}</td><td>${br(x.data)||'-'}</td><td>${br(x.receb||x.data)||'-'}</td>
  <td><span class="badge" style="background:${parcCor(st)};color:#fff">${st}</span></td>
  <td>${esc(formaTxt(x)||'-')}</td><td class="num">${money(x.valor)}</td><td>${esc(x.obs||'')}</td>
  <td>${parcRec(x)?`<button class="lnk" onclick="reciboForm('${l.id}','${x.id}')">${x.recibo?'Nº '+esc(x.recibo.numero||''):'Recibo'}</button>`:'-'}</td>
  <td class="num"><div style="display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap">${parcRec(x)?`<button class="lnk" onclick="parcCancelarPg('${l.id}','${x.id}')">Cancelar</button>`:`<button class="btn green sm" onclick="baixarLanc('${l.id}','${x.id}')">Receber</button>`}
   <button class="lnk" onclick="parcEditar('${l.id}','${x.id}')">Editar</button><button class="lnk" style="color:var(--bad)" onclick="parcExcluir('${l.id}','${x.id}')">Excluir</button></div></td></tr>`}).join('');
 openModal(`<h3>Parcelas</h3><p class="sub" style="margin-top:-4px">${esc(l.descricao||'Lançamento')}${p?' · '+esc(p.nome):''} · total ${money(l.valor)}</p>
 <div class="tw" style="border:1px solid var(--bd);border-radius:10px"><table class="tbl" style="margin:0"><thead><tr><th>Parcela</th><th>Vencimento</th><th>Pagamento</th><th>Recebimento</th><th>Situação</th><th>Forma de pagamento</th><th class="num">Valor</th><th>Observação</th><th>Recibo</th><th></th></tr></thead><tbody>${linhas||'<tr><td colspan="10" class="empty">Nenhuma parcela.</td></tr>'}</tbody></table></div>
 <div style="display:flex;gap:18px;flex-wrap:wrap;justify-content:flex-end;padding:12px 4px;font-size:14px"><span>Total do lançamento <b>${money(l.valor)}</b></span><span>Recebido <b style="color:var(--ok)">${money(recebido)}</b></span><span>Em aberto <b style="color:${emAberto>0.004?'var(--info)':'var(--mut)'}">${money(emAberto)}</b></span></div>
 <div class="mact"><button class="btn ghost" style="margin-right:auto" onclick="closeModal();render()">Fechar</button><button class="btn soft" onclick="parcDividir('${l.id}')">Dividir o saldo em parcelas</button><button class="btn soft" onclick="parcAdd('${l.id}')">Adicionar parcela</button>${emAberto>0.004?`<button class="btn green" onclick="baixarLanc('${l.id}')">Receber a próxima</button>`:''}</div>`,'1120px')}
function parcAtualiza(l){lancRecalc(l);save();const id=l.id,volta=UI.parcAberta===id;setTimeout(()=>{if(volta)parcelasLanc(id);else render()},0)}
function parcAdd(id){const l=S.lancamentos.find(x=>x.id===id);if(!l)return;
 formModal('Adicionar parcela',[{k:'venc',l:'Vencimento',type:'date',req:true},{k:'valor',l:'Valor',type:'dinheiro',req:true},{k:'forma',l:'Forma de pagamento prevista',type:'select',opts:['',...FORMAS_PAG]},{k:'obs',l:'Observação',full:true}],
  {venc:todayISO(),valor:r2(saldoL(l))||''},o=>{const P=parcL(l);P.push({id:uid(),venc:o.venc,data:'',receb:'',valor:r2(parseNum(o.valor)),forma:o.forma||'',obs:o.obs||'',recibo:null,status:'Em aberto'});
   const soma=r2(P.filter(x=>x.status!=='Cancelado').reduce((a,x)=>a+(Number(x.valor)||0),0));if(soma>(l.valor||0)+0.004)l.valor=soma;
   parcAtualiza(l);toast('Parcela adicionada');return 'skip'})}
function parcEditar(id,pid){const l=S.lancamentos.find(x=>x.id===id);if(!l)return;const x=parcL(l).find(y=>y.id===pid);if(!x)return;
 formModal('Editar parcela',[{k:'venc',l:'Vencimento',type:'date',req:true},{k:'valor',l:'Valor',type:'dinheiro',req:true},{k:'forma',l:'Forma de pagamento',type:'select',opts:['',...FORMAS_PAG]},...(parcRec(x)?[{k:'data',l:'Data do pagamento',type:'date'}]:[]),{k:'obs',l:'Observação',full:true}],
  {venc:x.venc,valor:x.valor,forma:x.forma||'',data:x.data||'',obs:x.obs||''},o=>{x.venc=o.venc;x.valor=r2(parseNum(o.valor));x.forma=o.forma;x.obs=o.obs;if(parcRec(x)&&o.data){x.data=o.data;x.receb=o.data}
   if(x.taxa)x.taxaValor=r2(x.valor*parseNum(x.taxa)/100),x.liquido=r2(x.valor-x.taxaValor);
   parcAtualiza(l);toast('Parcela alterada');return 'skip'})}
function parcExcluir(id,pid){const l=S.lancamentos.find(x=>x.id===id);if(!l)return;const P=parcL(l),i=P.findIndex(y=>y.id===pid);if(i<0)return;const x=P[i];
 confirmModal(parcRec(x)?'Excluir a parcela recebida de '+money(x.valor)+' de '+br(x.data)+'? O valor sai do caixa e volta para o saldo em aberto.':'Excluir a parcela de '+money(x.valor)+' com vencimento em '+br(x.venc)+'?',
  ()=>{P.splice(i,1);lancRecalc(l);save();if(UI.parcAberta===l.id)setTimeout(()=>parcelasLanc(l.id),10)},'Excluir parcela')}
function parcCancelarPg(id,pid){const l=S.lancamentos.find(x=>x.id===id);if(!l)return;const x=parcL(l).find(y=>y.id===pid);if(!x)return;
 confirmModal('Cancelar o pagamento de '+money(x.valor)+' recebido em '+br(x.data)+'? A parcela volta para em aberto e o valor sai do caixa do dia.',
  ()=>{x.status='Em aberto';x.data='';x.receb='';x.taxaValor='';x.liquido='';lancRecalc(l);save();if(UI.parcAberta===l.id)setTimeout(()=>parcelasLanc(l.id),10)},'Cancelar pagamento')}
function somaPeriodo(d0,i,per){const d=new Date(d0+'T00:00');if(per==='Semanal')d.setDate(d.getDate()+7*i);else if(per==='Quinzenal')d.setDate(d.getDate()+15*i);else d.setMonth(d.getMonth()+i);return iso(d)}
function parcDividir(id){const l=S.lancamentos.find(x=>x.id===id);if(!l)return;const saldo=r2(saldoL(l));

function fConferir(){const C=UI.conf;
 if(!C||!C.rows)return `<div class="phead"><div><h1>Conferência</h1><p class="sub">Compare o financeiro deste sistema com o do sistema anterior e veja exatamente onde os valores divergem.</p></div></div>

 const D=C.dif||[];const comDif=D.filter(x=>Math.abs(x.difValor)>0.004||Math.abs(x.difPago)>0.004);
 const tot=(k)=>D.reduce((a,x)=>a+x[k],0);
 return `<div class="phead"><div><h1>Conferência</h1><p class="sub">${esc(C.fileName)} · ${C.linhas} linhas lidas · ${D.length} pacientes comparados</p></div>

 <div class="grid g4" style="margin-bottom:16px">

 ${comDif.length?`<div class="note warn">Lançamentos criados direto aqui, fora da importação, não entram nesta comparação e não são tocados pelo acerto.</div>
 <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><h3 style="margin:0">Pacientes com diferença</h3>

async function confArquivo(input){const f=input.files&&input.files[0];if(!f)return;input.value='';
 if(typeof XLSX==='undefined'){toast('A biblioteca de leitura do Excel não carregou. Verifique a internet e recarregue a página.');return}
 try{
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array',raw:false});
  const nome0=wb.SheetNames[0];
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[nome0],{header:1,raw:true,defval:''}).filter(r=>r.some(c=>String(c).trim()!==''));
  const h=detectHeader(rows,'financeiro');const map=autoMap(rows[h]||[],'financeiro');
  if(map.paciente==null||map.valor==null){toast('Não reconheci as colunas de paciente e valor nessa planilha. Use o relatório financeiro completo do Clinicorp.');return}
  UI.conf={fileName:f.name,rows:rows.slice(h+1),map,linhas:rows.length-h-1};
  confComparar();render()}
 catch(e){toast('Não foi possível ler o arquivo: '+e.message)}}
function confChave(nome,cpf){const d=onlyDigits(cpf||'');return d.length>=11?d:norm(nome)}
function confComparar(){const C=UI.conf;const map=C.map;const G=(row,k)=>map[k]==null?'':row[map[k]];
 const planilha={};
 C.rows.forEach(row=>{const nome=str(G(row,'paciente'));if(!nome)return;
  const valor=parseNum(G(row,'valor')),pago=parseNum(G(row,'valorPago'));
  const st=norm(str(G(row,'status')));const temBaixa=!!parseDT(G(row,'pagamento')).d;
  const quitado=/(^| )(pago|paga|quitad|recebid|baixad|liquidad|confirmad)/.test(st)&&!/(nao|n o) pag|aberto|pendente|parcial|a receber|vencid|atras/.test(st);
  const pagoEfetivo=pago||((quitado||temBaixa)?valor:0);
  const k=confChave(nome,str(G(row,'cpf')));
  const o=planilha[k]||(planilha[k]={nome,chave:k,cliValor:0,cliPago:0,linhas:[]});
  o.cliValor=r2(o.cliValor+valor);o.cliPago=r2(o.cliPago+pagoEfetivo);o.linhas.push(row)});
 const D=Object.values(planilha).map(o=>{
  const p=S.pacientes.find(x=>confChave(x.nome,x.cpf)===o.chave)||S.pacientes.find(x=>norm(x.nome)===norm(o.nome));
  const L=p?S.lancamentos.filter(l=>l.pacienteId===p.id&&l.origem==='import'):[];
  const bfValor=r2(L.reduce((a,l)=>a+(Number(l.valor)||0),0));
  const bfPago=r2(L.reduce((a,l)=>a+pagoEf(l),0));
  return Object.assign(o,{pacienteId:p?p.id:'',semPaciente:!p,bfValor,bfPago,
   difValor:r2(o.cliValor-bfValor),difPago:r2(o.cliPago-bfPago)})});
 D.sort((a,b)=>Math.abs(b.difPago||b.difValor)-Math.abs(a.difPago||a.difValor));
 C.dif=D;return D}
function confAjustar(chave,silencioso){const C=UI.conf;if(!C)return;
 const x=(C.dif||[]).find(y=>y.chave===chave);if(!x)return;
 const map=C.map,G=(row,k)=>map[k]==null?'':row[map[k]];
 const p=x.pacienteId?pac(x.pacienteId):ensurePatient(x.nome,'');
 if(!p){toast('Não consegui identificar o paciente '+x.nome);return}
 /* troca apenas o que veio de importação, preservando o que foi lançado aqui */
 S.lancamentos=S.lancamentos.filter(l=>!(l.pacienteId===p.id&&l.origem==='import'));
 x.linhas.forEach(row=>{const valor=parseNum(G(row,'valor')),vp=parseNum(G(row,'valorPago'));
  if(!valor&&!vp)return;
  const l={id:uid(),pacienteId:p.id,descricao:str(G(row,'descricao'))||'Lançamento',valor:valor||vp,valorPago:vp,
   vencimento:parseDT(G(row,'vencimento')).d,pagamento:parseDT(G(row,'pagamento')).d,forma:str(G(row,'forma')),
   parcela:str(G(row,'parcela')),statusOrig:str(G(row,'status')),profissional:ensureProf(G(row,'profissional')),origem:'import'};
  parcMigra(l);lancRecalc(l);S.lancamentos.push(l)});
 if(!silencioso){save();confComparar();render();toast('Financeiro de '+p.nome+' acertado pelo Clinicorp.')}
 return true}
function confAjustarTodos(){const C=UI.conf;if(!C)return;
 const alvo=(C.dif||[]).filter(x=>Math.abs(x.difValor)>0.004||Math.abs(x.difPago)>0.004);
 if(!alvo.length){toast('Nada para acertar.');return}
 confirmModal(`Acertar o financeiro de <b>${alvo.length} paciente${alvo.length>1?'s':''}</b> pelos valores do Clinicorp?<br><br>Os lançamentos que vieram de importação desses pacientes são substituídos pelos da planilha. O que foi lançado direto aqui no sistema fica como está.`,()=>{
  let n=0;alvo.forEach(x=>{if(confAjustar(x.chave,true))n++});
  save();confComparar();render();toast(n+' paciente'+(n>1?'s acertados':' acertado')+' pelo Clinicorp.')},'Acertar');}
function fFluxo(){const y=UI.fluxoAno;const E=entradasList(),Sa=saidasList();let acc=0;
 const data=MESES.map((m,i)=>{const k=`${y}-${pad(i+1)}`;const ent=E.filter(x=>x.data&&x.data.startsWith(k)).reduce((a,x)=>a+x.valor,0);const sai=Sa.filter(x=>x.data&&x.data.startsWith(k)).reduce((a,x)=>a+x.valor,0);
  const arec=S.lancamentos.filter(l=>l.vencimento&&l.vencimento.startsWith(k)&&saldoL(l)>0).reduce((a,l)=>a+saldoL(l),0);const apag=S.contasPagar.filter(c=>c.vencimento&&c.vencimento.startsWith(k)&&!['Pago','Cancelado'].includes(stConta(c))).reduce((a,c)=>a+Math.max(0,c.valor-(c.valorPago||0)),0);
  const saldo=ent-sai;acc+=saldo;return {m,ent,sai,arec,apag,saldo,acc}});
 const anos=[];for(let a=new Date().getFullYear()+1;a>=new Date().getFullYear()-5;a--)anos.push(a);

/* ============ Importação de tudo de uma vez ============ */
const ORDEM=['pacientes','financeiro','tratamentos','agendamentos','anamnese','contasPagar'];
const SIG={pacientes:['celular','email','nascimento','cep','endereco','bairro','cidade','rg','sexo','comoConheceu','estadoCivil','profissao','telefone','numero','uf'],financeiro:['valorPago','vencimento','pagamento','forma','parcela'],tratamentos:['sessoesTotal','sessoesRealizadas','especialidade'],agendamentos:['hora','horaFim','duracao'],anamnese:['pergunta','resposta','modelo'],contasPagar:['fornecedor','categoria','tipo']};
const HINT={pacientes:['paciente','cadastro','cliente'],financeiro:['financ','receb','parcela','lancament','cobranc','receber'],tratamentos:['tratament','orcament','procediment','faturament'],agendamentos:['agend','agenda','consulta','atendiment'],anamnese:['anamnes','questionari'],contasPagar:['contas a pagar','pagar','despesa','fornecedor']};
const ANA_RX=/\?|diabet|alerg|medicament|hipertens|cirurg|gestant|fuma|tabag|circulac|variz|queixa|calcad|unha|patolog|doenc|marcapasso|anticoagul/;
function rawHead(h){return String(h??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()}
function detectType(rows,name){let best=null;const nn=norm(name);
 ORDEM.forEach(t=>{const hr=detectHeader(rows,t);const head=rows[hr]||[];const map=autoMap(head,t);if(IMPORT[t].req.some(k=>map[k]==null))return;
  let sc=SIG[t].filter(k=>map[k]!=null).length*2+Object.keys(map).length*0.3;
  if(HINT[t].some(h=>nn.includes(norm(h))))sc+=4;
  if(t==='anamnese'){const used=Object.values(map);sc+=head.filter((h,i)=>!used.includes(i)&&ANA_RX.test(rawHead(h))).length*1.5}
  if(t==='contasPagar'&&autoMap(head,'financeiro').paciente!=null)sc-=6;
  if(t==='pacientes'&&map.nome!=null&&autoMap(head,'financeiro').valor!=null)sc-=3;
  if(!best||sc>best.sc)best={type:t,sc,hr,map}});if(/leia me|instruc|como preencher/.test(nn)||(best&&best.sc<1.5))return null;return best}
function confLabel(sc){return sc>=6?'<span class="conf-a">Alta</span>':sc>=3?'<span class="conf-m">Média</span>':'<span class="conf-b">Baixa, confira</span>'}
function b64buf(b){const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer}
async function loteFiles(input){const fs=[...(input.files||[])];input.value='';await loteLer(fs.map(f=>({nome:f.name,ler:()=>f.arrayBuffer()})))}
function loteDrop(ev){ev.preventDefault();ev.currentTarget.classList.remove('over');const fs=[...((ev.dataTransfer&&ev.dataTransfer.files)||[])];if(fs.length)loteLer(fs.map(f=>({nome:f.name,ler:()=>f.arrayBuffer()})))}
async function loteEscolher(){const api=window.pywebview&&window.pywebview.api;
 if(api&&api.escolher_planilhas){try{const L=await api.escolher_planilhas();if(!L||!L.length)return;await loteLer(L.map((f,i)=>({nome:f.nome,ler:async()=>b64buf(await api.ler_planilha(i))})));return}catch(e){console.warn(e)}}
 const inp=document.getElementById('loteInput');if(inp)inp.click()}
async function loteLer(lista){if(!lista.length)return;if(typeof XLSX==='undefined'){toast('A biblioteca de leitura do Excel não carregou. Verifique a internet.');return}
 const base=UI.lote&&!UI.lote.feito?UI.lote:null;UI.loteLendo={total:lista.length,feitos:0};render();await new Promise(r=>setTimeout(r,30));
 const items=base?base.items.slice():[];
 for(const f of lista){if(!/\.(xlsx|xlsm|xls|csv|ods)$/i.test(f.nome)){toast(f.nome+' não é uma planilha e foi deixado de lado.');UI.loteLendo.feitos++;continue}
  try{const wb=XLSX.read(await f.ler(),{type:'array'});wb.SheetNames.forEach(sn=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''}).filter(r=>r.some(c=>String(c).trim()!==''));if(rows.length<2)return;
   const ja=items.findIndex(x=>x.arquivo===f.nome&&x.aba===sn);if(ja>=0)items.splice(ja,1);
   const ccp=ccpDetect(rows);if(ccp){items.push({id:uid(),arquivo:f.nome,aba:sn,rows,type:CCP[ccp].info?'ignorar':'clinicorp',ccp,sc:9,hr:0,map:{},result:null});return}
   const d=detectType(rows,f.nome+' '+sn);items.push({id:uid(),arquivo:f.nome,aba:sn,rows,type:d?d.type:'ignorar',sc:d?d.sc:0,hr:d?d.hr:0,map:d?d.map:{},result:null})})}
  catch(e){toast('Não foi possível ler '+f.nome+': '+e.message)}
  UI.loteLendo.feitos++;render();await new Promise(r=>setTimeout(r,10))}
 UI.loteLendo=null;
 if(!items.length){toast('Nenhuma aba com dados foi encontrada.');render();return}
 UI.lote={items,mode:UI.lote&&UI.lote.mode||'substituir',feito:false};render();toast(lista.length+(lista.length===1?' arquivo lido':' arquivos lidos'))}
function loteType(id,t){const it=UI.lote.items.find(x=>x.id===id);it.type=t;if(t!=='ignorar'&&t!=='clinicorp'){it.hr=detectHeader(it.rows,t);it.map=autoMap(it.rows[it.hr]||[],t)}render()}
function loteRun(){const L=UI.lote;const ja={};let tot=0;
 const cc=L.items.filter(it=>it.type==='clinicorp');
 if(cc.length){const res=importarClinicorp(cc,L.mode);cc.forEach(it=>{it.result=res[it.ccp]||{importadas:0};it.resumo=ccpResumo(it.ccp,res[it.ccp])});L.items.forEach(it=>{if(it.ccp&&CCP[it.ccp].info&&it.type==='ignorar')it.resumo='Não precisa importar'});
  Object.entries(res).forEach(([k,r])=>{tot+=r.importadas+(r.atualizadas||0);S.importacoes.unshift({id:uid(),data:new Date().toISOString(),tipo:'Clinicorp: '+CCP[k].label,arquivo:cc.filter(it=>it.ccp===k).map(it=>it.arquivo).join(', '),modo:'substituir',...r})})}
 for(const t of ORDEM){L.items.filter(it=>it.type===t).forEach(it=>{const def=IMPORT[t];const miss=def.req.filter(k=>it.map[k]==null);if(miss.length){it.result={erro:'Faltam colunas: '+miss.map(k=>fieldLabel(t,k)).join(', ')};return}
  const mode=L.mode==='substituir'&&!ja[t]?'substituir':'acrescentar';ja[t]=true;
  const r=IMPORTERS[t](it.rows.slice(it.hr+1),it.rows[it.hr],it.map,mode);it.result=r;tot+=r.importadas+(r.atualizadas||0);
  S.importacoes.unshift({id:uid(),data:new Date().toISOString(),tipo:def.label,arquivo:it.arquivo+' / '+it.aba,modo:t==='pacientes'?'atualizar':mode,...r})})}
 S.importacoes=S.importacoes.slice(0,60);L.feito=true;save();render();toast(tot+' registros gravados')}
