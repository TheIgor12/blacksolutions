<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HappyFEET Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" id="fav">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--acc:#0a4bde;--acc-soft:color-mix(in srgb,var(--acc) 9%,#fff);--navy:#254775;--bg:#f2f2f3;--card:#fff;--ink:#1f2328;--mut:#6b7280;--line:#e5e7eb;--top:#122b63;--ok:#2e9d5b;--ok-soft:#e5f5ec;--warn:#b77d00;--warn-soft:#fff5d6;--bad:#d64545;--bad-soft:#fde8e8;--info:#2f7fc1;--info-soft:#e6f0fa}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
input,select,textarea,button{font-family:inherit}
.top{position:sticky;top:0;z-index:30;height:48px;background:linear-gradient(90deg,#0e2456,#14306b 55%,#1b3f91);color:#fff;display:flex;align-items:center;gap:12px;padding:0 12px}
.ico{background:none;border:0;color:inherit;cursor:pointer;padding:6px;border-radius:6px;display:inline-flex;align-items:center}
.ico:hover{background:rgba(255,255,255,.08)}
.gsearch{flex:1;max-width:480px;margin:0 auto;position:relative}
.gsearch input{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:6px;padding:7px 12px;font-size:13px;outline:none}
.gsr{position:absolute;top:36px;left:0;right:0;background:#fff;color:var(--ink);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:none;max-height:380px;overflow:auto}
.gsr.on{display:block}
.gsr a{display:block;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.gsr a:hover{background:var(--acc-soft)}
.gsr small{color:var(--mut);display:block}
.gsr .gh{font-size:11px;color:var(--mut);padding:8px 12px 4px;text-transform:uppercase;letter-spacing:.05em}
.user{display:flex;align-items:center;gap:8px;font-size:12px;white-space:nowrap}
.user b{display:block}
.user small{color:#b9bcc4}
.av{width:30px;height:30px;border-radius:50%;background:var(--acc);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.av.xl{width:84px;height:84px;font-size:28px}
.drawer{position:fixed;top:0;left:0;bottom:0;width:250px;background:#fff;z-index:50;transform:translateX(-100%);transition:transform .2s;display:flex;flex-direction:column;box-shadow:2px 0 12px rgba(0,0,0,.15)}
.drawer.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none}
.scrim.open{display:block}
.brand{padding:18px 16px 4px}.brand img{max-width:170px;max-height:80px;display:block}.prod{padding:0 16px 6px;font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.04em}
.plan{margin:0 16px 10px;display:inline-block;background:var(--navy);color:#fff;border-radius:12px;font-size:11px;padding:2px 10px;align-self:flex-start}
.menu{flex:1;overflow:auto;padding:4px 0}
.menu button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:10px 16px;font-size:14px;cursor:pointer;color:var(--ink)}
.menu button:hover{background:var(--acc-soft)}
.menu button.on{color:var(--acc);font-weight:600;background:var(--acc-soft)}
.msec{font-size:11px;color:var(--mut);padding:8px 16px 4px;letter-spacing:.08em}
.mfoot{border-top:1px solid var(--line)}
.page{padding:20px 24px;max-width:1440px;margin:0 auto}
h1{font-size:22px;margin:0}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:16px;margin:0 0 14px}
.sub{color:var(--mut);font-size:13px;margin:4px 0 0}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card{background:var(--card);border-radius:14px;border:1px solid var(--line);padding:16px}
.card + .card{margin-top:16px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{filter:brightness(.95)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--acc-soft);color:var(--acc)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{background:var(--bad)}
.btn.green{background:var(--ok)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.lnk{color:var(--acc);cursor:pointer;font-weight:500;background:none;border:0;padding:0;font-size:inherit;text-align:left}
.lnk:hover{text-decoration:underline}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);background:#fff;overflow-x:auto;padding:0 12px}
.tabs button{background:none;border:0;padding:13px 12px;cursor:pointer;font-size:13px;color:var(--ink);white-space:nowrap;border-bottom:2px solid transparent}
.tabs button.on{color:var(--acc);border-color:var(--acc);font-weight:600}
.seg{display:inline-flex;background:#f1f1f1;border-radius:8px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--mut);font-size:12px;padding:10px;border-bottom:1px solid var(--line);background:#fafafa;white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:#f5f8ff}
.tbl.dark th{background:#14306b;color:#fff}
.tbl.mini{font-size:12px;margin-top:10px}
.tbl.mini td,.tbl.mini th{padding:6px 8px}
.num{text-align:right;white-space:nowrap}
.tbl th.num{text-align:right}
a.btn{text-decoration:none}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-info{background:var(--info-soft);color:var(--info)}
.b-mut{background:#eee;color:#666}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.g2{grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}
.tile{background:#fff;border-radius:14px;padding:18px;cursor:pointer;border:1px solid var(--line);transition:box-shadow .15s}
.tile:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.tile .ti{width:36px;height:36px;border-radius:8px;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.tile b{display:block;margin-bottom:6px}
.tile p{margin:0;color:var(--mut);font-size:12px;line-height:1.4}
.tile .cnt{float:right;font-size:12px;color:var(--mut)}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.kpi b{display:block;font-size:22px;margin:6px 0 2px}
.kpi span{color:var(--mut);font-size:12px}
.kpi.g b{color:var(--ok)}.kpi.r b{color:var(--bad)}
.filters{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.filters label,.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
.filters input,.filters select,.fgrid input,.fgrid select,.fgrid textarea,.inp{border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:13px;color:var(--ink);background:#fff;outline:none}
.filters input:focus,.fgrid input:focus,.fgrid select:focus,.fgrid textarea:focus,.inp:focus{border-color:var(--acc)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.modalw{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:640px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2b2d33;color:#fff;padding:10px 16px;border-radius:8px;z-index:80;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);gap:12px}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--ink);font-weight:500}
.row span:last-child{color:var(--mut);text-align:right}
.phd{background:#fff;padding:18px 24px 0;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.phd h1 small{color:var(--mut);font-weight:400}
.pgrid{display:grid;grid-template-columns:minmax(280px,1fr) minmax(280px,1fr) minmax(280px,1fr);gap:16px}
.pgrid .span2{grid-column:span 2}
.mini-empty{border:1px dashed var(--line);border-radius:8px;padding:16px;color:var(--mut);font-size:13px;text-align:center;margin-bottom:12px}
.bars{display:flex;gap:18px;align-items:flex-end;height:150px;padding:8px 4px 0;border-bottom:1px solid var(--line)}
.bgrp{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.bcols{flex:1;display:flex;gap:4px;align-items:flex-end;width:100%;justify-content:center}
.bcol{width:100%;max-width:28px;border-radius:3px 3px 0 0;min-height:1px}
.blab{font-size:11px;color:var(--mut);padding:4px 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.ag{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 48px)}
.agside{background:#fff;border-right:1px solid var(--line);padding:14px;overflow:auto}
.agmain{display:flex;flex-direction:column;min-width:0}
.agbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.agbar .ttl{font-weight:700;font-size:15px;flex:1;text-align:right}
.agscroll{overflow:auto;flex:1;background:#fff}
.agrid{display:grid;min-width:720px}
.aghead{position:sticky;top:0;background:#fff;z-index:5;border-bottom:1px solid var(--line);text-align:center;font-size:12px;padding:6px 2px;color:var(--mut)}
.aghead.today{background:var(--acc);color:#fff;font-weight:600}
.agtime{position:relative;font-size:11px;color:var(--mut);text-align:right;padding-right:6px}
.agtime div{position:absolute;right:6px;transform:translateY(-6px)}.agtime div:first-child{transform:none}
.agcol{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,#fff 0,#fff 31px,#f1f1f1 31px,#f1f1f1 32px)}
.agcol.wk{background-color:#fafafa}
.ev{position:absolute;background:#e3ebfd;border-left:3px solid var(--acc);border-radius:3px;padding:2px 5px;font-size:11px;overflow:hidden;cursor:pointer;line-height:1.25;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ev b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.ev span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#33476b}
.ev.falta{background:#fde8e8;border-left-color:var(--bad)}
.ev.desm{background:#eee;border-left-color:#999;text-decoration:line-through;opacity:.75}
.ev.ok{background:#e5f5ec;border-left-color:var(--ok)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--acc);z-index:3}
.pchk{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:4px;cursor:pointer;font-size:12px}
.pchk i{width:12px;height:12px;border-radius:2px;flex:none}
.pchk.off{opacity:.4}
.side-h{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 6px}
.ret{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:5px 0;border-bottom:1px solid var(--line);gap:6px}
.wa{color:#25a244;display:inline-flex;vertical-align:middle}
.drop{border:2px dashed #a9bdf3;background:#f7f9ff;border-radius:10px;padding:30px;text-align:center;color:var(--mut)}
.drop input{margin-top:12px}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.steps span{background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--mut)}
.steps span.on{border-color:var(--acc);color:var(--acc);font-weight:600}
.note{background:var(--info-soft);color:#24557f;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.45;margin-bottom:14px}
.note.warn{background:var(--warn-soft);color:#6b4d00}
.qa{display:grid;grid-template-columns:minmax(160px,35%) 1fr;border-top:1px solid var(--line)}
.qa div{padding:7px 8px;border-bottom:1px solid var(--line);font-size:13px}
.qa div:nth-child(odd){color:var(--mut);background:#fafafa}
.rlist button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--ink)}
.rlist button:hover{background:var(--acc-soft)}
.rlist button.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.rgrp{font-size:12px;font-weight:700;color:var(--mut);margin:12px 10px 4px;text-transform:uppercase;letter-spacing:.05em}
.split{display:grid;grid-template-columns:260px 1fr;gap:16px}
.dayrow{border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:10px}
.dayrow summary{list-style:none;display:grid;grid-template-columns:120px repeat(3,1fr) 20px;gap:10px;align-items:center;padding:12px 16px;cursor:pointer}
.dayrow summary::-webkit-details-marker{display:none}
.dayrow .dn b{font-size:20px;display:block}
.dayrow .dn small{color:var(--mut)}
.dayrow .kv small{display:block;color:var(--mut);font-size:10px;text-transform:uppercase}
.pager{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 0;font-size:12px;color:var(--mut);flex-wrap:wrap;gap:8px}
.pager button{border:1px solid var(--line);background:#fff;border-radius:4px;padding:3px 9px;cursor:pointer}
.color-dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px}
.sync{font-size:12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:#d6def5}.sync i{width:8px;height:8px;border-radius:50%;display:inline-block}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#0e2456,#1b3f91)}
.authbox{background:#fff;border-radius:18px;width:100%;max-width:420px;padding:30px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.authbox .lg{display:flex;align-items:center;gap:14px;margin-bottom:22px}.authbox .lg img.m{width:64px;height:64px}.authbox .lg img.l{max-width:180px;max-height:70px}
.authbox label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut);margin-bottom:12px}.authbox input{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;outline:none}.authbox input:focus{border-color:var(--acc)}
.authbox .btn{width:100%;justify-content:center;padding:11px}.authmsg{font-size:13px;margin:10px 0;min-height:18px}.authmsg.err{color:var(--bad)}.authmsg.ok{color:var(--ok)}
.authlinks{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:13px;flex-wrap:wrap}
.hero{display:flex;align-items:center;gap:22px;margin-bottom:26px}.hero img{width:96px;height:96px;flex:none}
.conf-a{color:var(--ok);font-weight:700}.conf-m{color:var(--warn);font-weight:700}.conf-b{color:var(--bad);font-weight:700}
@media (max-width:900px){
 .pgrid{grid-template-columns:1fr}.pgrid .span2{grid-column:auto}
 .ag{grid-template-columns:1fr}.agside{display:none}
 .split{grid-template-columns:1fr}
 .g2{grid-template-columns:1fr}
 .fgrid{grid-template-columns:1fr}
 .user div{display:none}
 .page{padding:16px}
 .dayrow summary{grid-template-columns:80px repeat(3,1fr) 16px;padding:10px}
}
@media print{.top,.drawer,.scrim,.btn,.tabs{display:none!important}body{background:#fff}}
</style>
</head>

const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const money=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const str=v=>String(v??'').trim();
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
const todayISO=()=>iso(new Date());
function addDays(isoStr,n){const d=new Date(isoStr+'T00:00');d.setDate(d.getDate()+n);return iso(d)}
function br(d){if(!d)return '-';const p=d.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d}
function diffDays(a,b){return Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/86400000)}
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DIAS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
function monthLabel(k){const [y,m]=k.split('-');return MESES[+m-1]+'/'+y.slice(2)}
function initials(n){return String(n||'?').trim().split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?'}
function age(d){if(!d)return '';const b=new Date(d+'T00:00'),t=new Date();let a=t.getFullYear()-b.getFullYear();const m=t.getMonth()-b.getMonth();if(m<0||(m===0&&t.getDate()<b.getDate()))a--;return isNaN(a)?'':a}
function onlyDigits(v){return String(v??'').replace(/\D/g,'')}
function fmtCPF(c){const d=onlyDigits(c);if(!d)return '';const x=d.padStart(11,'0');return d.length<=11?`${x.slice(0,3)}.${x.slice(3,6)}.${x.slice(6,9)}-${x.slice(9)}`:c}
function keyCPF(c){const d=onlyDigits(c);return d.length>=9&&d.length<=11?d.padStart(11,'0'):''}
function waLink(p,msg){let d=onlyDigits(p);if(d.length<10)return '';if(!d.startsWith('55')||d.length<=11)d='55'+d;return `https://wa.me/${d}${msg?'?text='+encodeURIComponent(msg):''}`}
function parseNum(v){if(typeof v==='number')return v;let s=String(v??'').replace(/R\$/g,'').replace(/\s/g,'');if(!s)return 0;const neg=/^\(.*\)$/.test(s)||s.startsWith('-');s=s.replace(/[()\-+]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isNaN(n)?0:(neg?-n:n)}
function parseDT(v){
 if(v===''||v==null)return {d:'',t:''};
 if(typeof v==='number'&&typeof XLSX!=='undefined'){const o=XLSX.SSF.parse_date_code(v);if(!o)return {d:'',t:''};return {d:v>=1?`${o.y}-${pad(o.m)}-${pad(o.d)}`:'',t:(o.H||o.M)?`${pad(o.H)}:${pad(o.M)}`:''}}
 if(v instanceof Date)return {d:iso(v),t:''};
 const s=String(v).trim();let m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})(?:[ T,]+(\d{1,2})[:h](\d{2}))?/);
 if(m){let y=+m[3];if(y<100)y+=2000;return {d:`${y}-${pad(m[2])}-${pad(m[1])}`,t:m[4]?`${pad(m[4])}:${m[5]}`:''}}
 m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);if(m)return {d:`${m[1]}-${pad(m[2])}-${pad(m[3])}`,t:m[4]?`${pad(m[4])}:${m[5]}`:''};
 m=s.match(/^(\d{1,2})[:h](\d{2})/);if(m)return {d:'',t:`${pad(m[1])}:${m[2]}`};
 return {d:'',t:''}}
function splitNome(n){let nome=str(n),codigo='';const m=nome.match(/^(.*?)\s*\((\d+)\)\s*$/);if(m){nome=m[1].trim();codigo=m[2]}return {nome,codigo}}
function saveWB(wb,name){const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});download(name,new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}))}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function download(name,blob){if(window.pywebview&&window.pywebview.api&&window.pywebview.api.salvar_arquivo){const fr=new FileReader();fr.onload=async()=>{const p=await window.pywebview.api.salvar_arquivo(name,String(fr.result).split(',')[1]);if(p)toast('Arquivo salvo em '+p)};fr.readAsDataURL(blob);return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

function profColor(n){const p=S.profissionais.find(x=>norm(x.nome)===norm(n));return p?p.cor:'#0a4bde'}
function nextCodigo(){let m=0;S.pacientes.forEach(p=>{const n=parseInt(p.codigo,10);if(n>m)m=n});return String(m+1)}
function findPatient(nome,cpf,codigo){const k=keyCPF(cpf);if(k){const p=S.pacientes.find(p=>keyCPF(p.cpf)===k);if(p)return p}
 if(codigo){const p=S.pacientes.find(p=>String(p.codigo)===String(codigo)&&norm(p.nome)===norm(nome));if(p)return p}
 const n=norm(nome);if(!n)return null;return S.pacientes.find(p=>norm(p.nome)===n)||null}
function ensurePatient(nomeRaw,cpf){const {nome,codigo}=splitNome(nomeRaw);let p=findPatient(nome,cpf,codigo);
 if(!p&&nome){p={id:uid(),codigo:codigo||nextCodigo(),nome,cpf:str(cpf),status:'Ativo',criadoPorImportacao:true};S.pacientes.push(p)}return p}
const pac=id=>S.pacientes.find(p=>p.id===id);
function stLanc(l){const s=norm(l.statusOrig);if(/cancel|estorn/.test(s))return 'Cancelado';
 const aberto=/(nao|n o) pag|aberto|pendente|parcial|a receber|vencid|atras/.test(s);
 const pagoTxt=!aberto&&/(^| )(pago|paga|quitad|recebid|baixad|liquidad|confirmad)/.test(s);
 if(pagoTxt||(!aberto&&l.pagamento)||(l.valor>0&&l.valorPago>=l.valor-0.005))return 'Pago';
 if(l.vencimento&&l.vencimento<todayISO())return 'Em atraso';return 'A vencer'}
function pagoEf(l){const st=stLanc(l);if(st==='Cancelado')return 0;if(st==='Pago')return l.valorPago||l.valor||0;return l.valorPago||0}
function saldoL(l){return stLanc(l)==='Cancelado'?0:Math.max(0,(l.valor||0)-pagoEf(l))}
function stConta(c){const s=norm(c.statusOrig);if(/cancel/.test(s))return 'Cancelado';const ab=/aberto|pendente|a pagar|nao pag/.test(s);
 if((!ab&&(c.pagamento||/(^| )(pago|paga|quitad|baixad|liquidad)/.test(s)))||(c.valor>0&&c.valorPago>=c.valor-0.005))return 'Pago';
 if(c.vencimento&&c.vencimento<todayISO())return 'Em atraso';return 'A vencer'}
function stTrat(t){const s=norm(t.statusOrig);if(/conclu|finaliz|executad/.test(s))return 'Concluído';if(/reprov|recus|cancel|perdid/.test(s))return 'Reprovado';
 if(/follow/.test(s))return 'Em follow up';if(/aberto|pendente|aguard|negocia/.test(s))return 'Em aberto';
 if((t.sessoesTotal||0)>0&&(t.sessoesRealizadas||0)>=t.sessoesTotal)return 'Concluído';return 'Aprovado'}
function stAg(a){const s=norm(a.status);if(/falt|nao compareceu|ausen/.test(s))return 'Faltou';if(/desmarc|cancel|remarc/.test(s))return 'Desmarcado';
 if(/atendid|conclu|finaliz|realizad/.test(s))return 'Atendido';if(/confirm/.test(s))return 'Confirmado';return 'Agendado'}
function badgeFor(st){const m={'Pago':'b-ok','Concluído':'b-ok','Atendido':'b-ok','Aprovado':'b-ok','Ativo':'b-ok','Confirmado':'b-info','A vencer':'b-info','Agendado':'b-info','Em aberto':'b-warn','Em follow up':'b-warn','Em atraso':'b-bad','Faltou':'b-bad','Reprovado':'b-bad','Inativo':'b-mut','Cancelado':'b-mut','Desmarcado':'b-mut'};return `<span class="badge ${m[st]||'b-mut'}">${esc(st)}</span>`}

function saidasList(){return S.contasPagar.filter(c=>stConta(c)==='Pago').map(c=>({data:c.pagamento||c.vencimento,valor:c.valorPago||c.valor,c}))}
function lastApptMap(){const m={};const t=todayISO();S.agendamentos.forEach(a=>{const sa=stAg(a);if(sa==='Desmarcado'||(sa==='Faltou'&&a.data<=t))return;const o=m[a.pacienteId]||(m[a.pacienteId]={last:'',next:''});if(a.data<=t){if(a.data>o.last)o.last=a.data}else{if(!o.next||a.data<o.next)o.next=a.data}});return m}
function retornoList(){const m=lastApptMap(),t=todayISO(),lim=Number(S.config.diasRetorno)||90;return S.pacientes.filter(p=>p.status!=='Inativo').map(p=>({p,o:m[p.id]})).filter(x=>x.o&&x.o.last&&!x.o.next&&diffDays(x.o.last,t)>=lim).map(x=>({p:x.p,last:x.o.last,dias:diffDays(x.o.last,t)})).sort((a,b)=>a.dias-b.dias)}
function inadList(){const t=todayISO();const g={};S.lancamentos.forEach(l=>{if(stLanc(l)!=='Em atraso')return;const s=saldoL(l);if(s<=0)return;const o=g[l.pacienteId]||(g[l.pacienteId]={pacienteId:l.pacienteId,qtd:0,valor:0,maisAntigo:l.vencimento});o.qtd++;o.valor+=s;if(l.vencimento<o.maisAntigo)o.maisAntigo=l.vencimento});

 return `<div class="pgrid"><div class="card" style="grid-row:span 2"><h2>Informações do paciente</h2><div class="seg" style="width:100%;margin-bottom:10px">${[['cadastro','Cadastro'],['contato','Contato'],['complemento','Complemento']].map(([k,t])=>`<button style="flex:1" class="${UI.pacInfo===k?'on':''}" onclick="UI.pacInfo='${k}';render()">${t}</button>`).join('')}</div>${rows(info)}</div>

function parcelasForm(pid){formModal('Adicionar parcelamento',[{k:'descricao',l:'Descrição',req:true,full:true},{k:'total',l:'Valor total',type:'number',req:true},{k:'qtd',l:'Quantidade de parcelas',type:'number',req:true},{k:'primeiro',l:'Primeiro vencimento',type:'date',req:true},{k:'forma',l:'Forma de pagamento',type:'select',opts:['','Pix','Dinheiro','Cartão de crédito','Boleto','Cheque']}],{descricao:'Lançamento de Tratamento',qtd:1,primeiro:todayISO()},
 o=>{const n=Math.max(1,Math.round(o.qtd));const base=Math.floor(o.total/n*100)/100;const d0=new Date(o.primeiro+'T00:00');for(let i=0;i<n;i++){const d=new Date(d0);d.setMonth(d0.getMonth()+i);const v=i===n-1?Math.round((o.total-base*(n-1))*100)/100:base;S.lancamentos.push({id:uid(),pacienteId:pid,descricao:o.descricao,valor:v,valorPago:0,vencimento:iso(d),pagamento:'',forma:o.forma,parcela:`${i+1}/${n}`,statusOrig:'',origem:'manual'})}})}

 S.evolucoes.push({id:uid(),pacienteId:t.pacienteId,data:todayISO(),profissional:t.profissional||'',texto:`Sessão ${t.sessoesRealizadas}/${t.sessoesTotal} de ${t.procedimento} realizada.`});save();render();toast('Sessão registrada e lançada na evolução')}

function fGeral(){const T=[['conta','Conta Corrente','Recebimentos e pagamentos por dia','money'],['fluxo','Fluxo de Caixa','Saldo realizado e previsto','chart'],['pagar','Contas a Pagar','Despesas, fornecedores e baixa','up'],['receber','Contas a Receber','Parcelas em aberto e baixa','down'],['inad','Inadimplência','Parcelas vencidas e cobrança por WhatsApp','alert']];
 return `<h1>Financeiro</h1><p class="sub" style="margin-bottom:20px">Faça a gestão financeira da sua clínica, acompanhe entradas e saídas diárias.</p><div class="grid g4">${T.map(([k,t,d,i])=>`<div class="tile" onclick="UI.finTab='${k}';render()"><div class="ti">${ico(i)}</div><b>${t}</b><p>${d}</p></div>`).join('')}</div>`}
function fConta(){const E=entradasList().filter(x=>inRange(x.data)),Sa=saidasList().filter(x=>inRange(x.data));const te=E.reduce((a,x)=>a+x.valor,0),ts=Sa.reduce((a,x)=>a+x.valor,0);
 const vendas=S.tratamentos.filter(t=>inRange(t.data)&&!['Reprovado','Em aberto','Em follow up'].includes(stTrat(t))).reduce((a,t)=>a+(t.valor||0),0);
 const days={};E.forEach(x=>{(days[x.data]||(days[x.data]={e:[],s:[]})).e.push(x)});Sa.forEach(x=>{(days[x.data]||(days[x.data]={e:[],s:[]})).s.push(x)});
 const keys=Object.keys(days).sort().reverse();
 return `<div class="phead"><div><h1>Conta Corrente</h1><p class="sub">Listagem de vendas, entradas e saídas da clínica.</p></div><button class="btn ghost" onclick="window.print()">${ico('print',16)} Imprimir</button></div>

function detectType(rows,name){let best=null;const nn=norm(name);
 ORDEM.forEach(t=>{const hr=detectHeader(rows,t);const head=rows[hr]||[];const map=autoMap(head,t);if(IMPORT[t].req.some(k=>map[k]==null))return;
  let sc=SIG[t].filter(k=>map[k]!=null).length*2+Object.keys(map).length*0.3;
  if(HINT[t].some(h=>nn.includes(norm(h))))sc+=4;
  if(t==='anamnese'){const used=Object.values(map);sc+=head.filter((h,i)=>!used.includes(i)&&ANA_RX.test(rawHead(h))).length*1.5}
  if(t==='contasPagar'&&autoMap(head,'financeiro').paciente!=null)sc-=6;
  if(t==='pacientes'&&map.nome!=null&&autoMap(head,'financeiro').valor!=null)sc-=3;
  if(!best||sc>best.sc)best={type:t,sc,hr,map}});if(/leia me|instruc|como preencher/.test(nn)||(best&&best.sc<1.5))return null;return best}
function confLabel(sc){return sc>=6?'<span class="conf-a">Alta</span>':sc>=3?'<span class="conf-m">Média</span>':'<span class="conf-b">Baixa, confira</span>'}
async function loteFiles(input){const files=[...(input.files||[])];if(!files.length)return;if(typeof XLSX==='undefined'){toast('A biblioteca de leitura do Excel não carregou. Verifique a internet.');return}
 const items=[];for(const f of files){try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});wb.SheetNames.forEach(sn=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''}).filter(r=>r.some(c=>String(c).trim()!==''));if(rows.length<2)return;
  const d=detectType(rows,f.name+' '+sn);items.push({id:uid(),arquivo:f.name,aba:sn,rows,type:d?d.type:'ignorar',sc:d?d.sc:0,hr:d?d.hr:0,map:d?d.map:{},result:null})})}catch(e){toast('Não foi possível ler '+f.name+': '+e.message)}}
 if(!items.length){toast('Nenhuma aba com dados foi encontrada.');return}UI.lote={items,mode:UI.lote&&UI.lote.mode||'substituir',feito:false};render()}
function loteType(id,t){const it=UI.lote.items.find(x=>x.id===id);it.type=t;if(t!=='ignorar'){it.hr=detectHeader(it.rows,t);it.map=autoMap(it.rows[it.hr]||[],t)}render()}
function loteRun(){const L=UI.lote;const ja={};let tot=0;
 for(const t of ORDEM){L.items.filter(it=>it.type===t).forEach(it=>{const def=IMPORT[t];const miss=def.req.filter(k=>it.map[k]==null);if(miss.length){it.result={erro:'Faltam colunas: '+miss.map(k=>fieldLabel(t,k)).join(', ')};return}
  const mode=L.mode==='substituir'&&!ja[t]?'substituir':'acrescentar';ja[t]=true;
  const r=IMPORTERS[t](it.rows.slice(it.hr+1),it.rows[it.hr],it.map,mode);it.result=r;tot+=r.importadas+(r.atualizadas||0);
  S.importacoes.unshift({id:uid(),data:new Date().toISOString(),tipo:def.label,arquivo:it.arquivo+' / '+it.aba,modo:t==='pacientes'?'atualizar':mode,...r})})}
 S.importacoes=S.importacoes.slice(0,60);L.feito=true;save();render();toast(tot+' registros gravados')}

  return `<tr><td>${esc(it.arquivo)}</td><td>${esc(it.aba)}</td><td class="num">${it.rows.length-it.hr-1}</td><td><select class="inp" ${L.feito?'disabled':''} onchange="loteType('${it.id}',this.value)">${tipos.map(([k,l])=>`<option value="${k}" ${k===it.type?'selected':''}>${esc(l)}</option>`).join('')}</select></td><td>${it.type==='ignorar'?'-':confLabel(it.sc)}</td><td style="font-size:12px;color:var(--mut);max-width:340px">${esc(cols)}</td>${L.feito?`<td style="font-size:12px">${r?(r.erro?`<span style="color:var(--bad)">${esc(r.erro)}</span>`:`${r.importadas} novos${r.atualizadas?', '+r.atualizadas+' atualizados':''}${r.ignoradas?', '+r.ignoradas+' ignorados':''}${r.novosPacientes?', '+r.novosPacientes+' pacientes criados':''}`):'Ignorada'}</td>`:''}</tr>`}).join('')}</tbody></table></div>
 ${L.feito?'':`<div style="margin-top:14px"><label style="display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;cursor:pointer"><input type="radio" name="lm" ${L.mode==='substituir'?'checked':''} onchange="UI.lote.mode='substituir'"><span><b>Substituir</b> o que veio de importações anteriores (use quando exportar tudo de novo). O que foi lançado à mão é preservado.</span></label><label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer"><input type="radio" name="lm" ${L.mode==='acrescentar'?'checked':''} onchange="UI.lote.mode='acrescentar'"><span><b>Acrescentar</b> às informações existentes (use só para planilhas de outro período).</span></label>

function baixarModelo(){if(typeof XLSX==='undefined'){toast('Biblioteca de Excel não carregou');return}const wb=XLSX.utils.book_new();

 ORDEM.forEach(t=>{let h=IMPORT[t].fields.filter(([k])=>!['pergunta','resposta','modelo'].includes(k)).map(([,l])=>l);if(t==='anamnese')h=h.concat(['Diabético?','Hipertenso?','Alergias','Medicamentos em uso','Queixa principal']);XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([h]),nomes[t])});
 saveWB(wb,'modelo_importacao_happyfeet.xlsx')}

 case 'bloqueado':return box(`<h2>Acesso suspenso</h2><p class="sub">O acesso da clínica <b>${esc(NV.nomeClinica)}</b> está suspenso ou a assinatura venceu. Entre em contato com o suporte para regularizar.</p><div class="authlinks"><button class="lnk" onclick="entrar(NV.sessao)">Tentar de novo</button><button class="lnk" onclick="sair()">Sair</button></div>`);
 case 'offline':return box(`<h2>Sem conexão</h2><p class="sub" style="margin-bottom:14px">Não foi possível falar com o servidor. Verifique a internet.</p>${A.temCache?`<p class="sub" style="margin-bottom:14px">Você pode abrir os dados salvos neste computador. O que for alterado será enviado quando a internet voltar.</p><button class="btn" onclick="abrirOffline()">Abrir dados salvos neste computador</button><div style="height:10px"></div>`:''}<button class="btn ghost" onclick="location.reload()">Tentar de novo</button>`);
 default:return box(`<h2>Entrar</h2><form onsubmit="authEntrar();return false"><label>E-mail<input id="au_email" type="email" autocomplete="email" value="${esc(A.email||'')}"></label><label>Senha<input id="au_senha" type="password" autocomplete="current-password"></label>${msg}<button class="btn">Entrar</button></form><div class="authlinks"><button class="lnk" onclick="UI.auth={modo:'esqueci',email:val('#au_email')};render()">Esqueci minha senha</button><button class="lnk" onclick="UI.auth={modo:'criar',email:val('#au_email')};render()">Criar conta</button></div>`)}}
async function authEntrar(){const email=val('#au_email'),senha=$('#au_senha').value;if(!email||!senha){authMsg('Informe e-mail e senha.');return}authMsg('Entrando...',true);
 const {data,error}=await NV.sb.auth.signInWithPassword({email,password:senha});
 if(error){if(/not confirmed/i.test(error.message)){await NV.sb.auth.resend({type:'signup',email});UI.auth={modo:'codigo',email,msg:'Seu e-mail ainda não foi confirmado. Enviamos um novo código.',ok:true};render();return}authMsg(traduz(error));return}
 await entrar(data.session)}
async function authCriar(){const nome=val('#au_nome'),email=val('#au_email'),senha=$('#au_senha').value,s2=$('#au_senha2').value;
 if(!nome||!email){authMsg('Preencha nome e e-mail.');return}if(senha.length<8){authMsg('A senha precisa ter pelo menos 8 caracteres.');return}if(senha!==s2){authMsg('As senhas não conferem.');return}
 authMsg('Criando conta...',true);const {data,error}=await NV.sb.auth.signUp({email,password:senha,options:{data:{nome}}});
 if(error){authMsg(traduz(error));return}if(data.session){await entrar(data.session);return}
 UI.auth={modo:'codigo',email,msg:'Se este e-mail já tinha cadastro, volte e use Entrar.',ok:true};render()}
async function authCodigo(){const cod=val('#au_cod').replace(/\s/g,'');if(!cod){authMsg('Digite o código.');return}authMsg('Confirmando...',true);
 let r=await NV.sb.auth.verifyOtp({email:UI.auth.email,token:cod,type:'signup'});if(r.error)r=await NV.sb.auth.verifyOtp({email:UI.auth.email,token:cod,type:'email'});
 if(r.error){authMsg(traduz(r.error));return}await entrar(r.data.session)}
async function authReenviar(){const {error}=await NV.sb.auth.resend({type:'signup',email:UI.auth.email});authMsg(error?traduz(error):'Novo código enviado.',!error)}
async function authEsqueci(){const email=val('#au_email');if(!email){authMsg('Informe o e-mail.');return}authMsg('Enviando...',true);const {error}=await NV.sb.auth.resetPasswordForEmail(email);if(error){authMsg(traduz(error));return}UI.auth={modo:'nova_senha',email};render()}
async function authNovaSenha(){const cod=val('#au_cod').replace(/\s/g,''),senha=$('#au_senha').value,s2=$('#au_senha2').value;if(senha.length<8){authMsg('A senha precisa ter pelo menos 8 caracteres.');return}if(senha!==s2){authMsg('As senhas não conferem.');return}
 authMsg('Salvando...',true);const r=await NV.sb.auth.verifyOtp({email:UI.auth.email,token:cod,type:'recovery'});if(r.error){authMsg(traduz(r.error));return}
 const u=await NV.sb.auth.updateUser({password:senha});if(u.error){authMsg(traduz(u.error));return}await entrar(r.data.session)}
async function authClinica(){const nome=val('#au_clin');if(!nome){authMsg('Informe o nome da clínica.');return}authMsg('Criando...',true);const {error}=await NV.sb.rpc('criar_clinica',{p_nome:nome});if(error){authMsg(traduz(error));return}await entrar(NV.sessao)}
async function entrar(sessao){NV.sessao=sessao;NV.offline=false;UI.auth={modo:'carregando'};render();
 try{await NV.sb.rpc('aceitar_convites')}catch(e){}
 const {data:m,error}=await NV.sb.from('membros').select('clinica_id,papel,clinicas(nome,ativa,valido_ate)').eq('user_id',sessao.user.id);
 if(error){UI.auth={modo:'entrar',email:sessao.user.email,msg:traduz(error)};render();return}
 if(!m.length){UI.auth={modo:'clinica'};render();return}
 const ult=await DB.get('ultimo');const esc_=m.find(x=>ult&&x.clinica_id===ult.clinicaId)||m[0];
 NV.clinicaId=esc_.clinica_id;NV.papel=esc_.papel;NV.nomeClinica=(esc_.clinicas&&esc_.clinicas.nome)||'';
 const cl=esc_.clinicas||{};if(cl.ativa===false||(cl.valido_ate&&cl.valido_ate<todayISO())){UI.auth={modo:'bloqueado'};render();return}
 try{await abrirClinica()}catch(e){console.error(e);UI.auth={modo:'entrar',email:sessao.user.email,msg:traduz(e)};render()}}
async function carregarCache(){const c=await DB.get('c_'+NV.clinicaId);const d=defaultState();
 if(c&&c.S){S={...d,...c.S,config:{...d.config,...(c.S.config||{})}};NV.hashes=c.hashes||{};NV.cursor=c.cursor||0}else{S=d;NV.hashes={};NV.cursor=0}}
async function abrirClinica(){await carregarCache();if(!S.config.clinica||S.config.clinica===defaultState().config.clinica)S.config.clinica=NV.nomeClinica||S.config.clinica;
 UI.auth={modo:'carregando',msg:'Baixando os dados da clínica...'};render();await puxar();
 await DB.set({clinicaId:NV.clinicaId,email:NV.sessao.user.email,nome:NV.nomeClinica},'ultimo');
 UI.auth=null;UI.view='inicio';render();iniciarSync();
 const vazio=!Object.keys(NV.hashes).some(k=>k!=='config:config'&&NV.hashes[k]);
 if(vazio&&NV.papel==='admin'){const old=await DB.get('state');if(old&&Array.isArray(old.pacientes)&&old.pacientes.length){
  openModal(`<h3>Dados encontrados neste computador</h3><p>Este computador tem ${old.pacientes.length} pacientes gravados antes do login. Deseja enviá-los para a nuvem da clínica <b>${esc(NV.nomeClinica)}</b>?</p><div class="mact"><button class="btn ghost" onclick="closeModal()">Agora não</button><button class="btn" id="migY">Enviar para a nuvem</button></div>`);
  $('#migY').onclick=()=>{const d=defaultState();const cfg=S.config;S={...d,...old,config:{...d.config,...(old.config||{}),clinica:cfg.clinica}};closeModal();save();render();toast('Enviando os dados para a nuvem...')}}}
 enviar()}
async function abrirOffline(){const u=await DB.get('ultimo');if(!u){toast('Nenhum dado salvo neste computador.');return}NV.clinicaId=u.clinicaId;NV.nomeClinica=u.nome;NV.offline=true;NV.sessao={user:{email:u.email,user_metadata:{}}};await carregarCache();UI.auth=null;render();setSync('off')}
function persistirNuvem(){if(NV.clinicaId)DB.set({S,hashes:NV.hashes,cursor:NV.cursor},'c_'+NV.clinicaId)}
function temAlteracaoLocal(k,obj){return NV.hashes[k]!==undefined&&NV.hashes[k]!==JSON.stringify(obj)}
function aplicarRemoto(r){const k=r.colecao+':'+r.id;
 if(r.colecao==='config'){if(temAlteracaoLocal(k,S.config))return;S.config={...defaultState().config,...r.dados};NV.hashes[k]=JSON.stringify(S.config);return}
 const arr=S[r.colecao];if(!Array.isArray(arr))return;const i=arr.findIndex(x=>x.id===r.id);
 if(i>=0&&temAlteracaoLocal(k,arr[i]))return;
 if(r.excluido){if(i>=0)arr.splice(i,1);NV.hashes[k]=null;return}
 const obj={...r.dados,id:r.id};if(i>=0)arr[i]=obj;else arr.push(obj);NV.hashes[k]=JSON.stringify(obj)}
async function puxar(){if(!NV.sb||NV.offline)return 0;let n=0;
 for(;;){const {data,error}=await NV.sb.from('registros').select('colecao,id,dados,excluido,seq').eq('clinica_id',NV.clinicaId).gt('seq',NV.cursor).order('seq').limit(1000);
  if(error)throw error;data.forEach(aplicarRemoto);n+=data.length;if(data.length)NV.cursor=data[data.length-1].seq;if(data.length<1000)break}
 if(n)persistirNuvem();return n}
let envioTimer;function agendarEnvio(){if(!NV.ativa||!NV.clinicaId||NV.offline)return;clearTimeout(envioTimer);envioTimer=setTimeout(enviar,1200)}
async function enviar(){if(!NV.sb||!NV.clinicaId||NV.offline)return;if(NV.ocupado){agendarEnvio();return}NV.ocupado=true;
 try{const ups=[],vistos={};
  COLS.forEach(c=>(S[c]||[]).forEach(x=>{const k=c+':'+x.id;const j=JSON.stringify(x);vistos[k]=1;if(NV.hashes[k]!==j)ups.push({row:{clinica_id:NV.clinicaId,colecao:c,id:String(x.id),dados:x,excluido:false},k,j})}));
  const cj=JSON.stringify(S.config);if(NV.hashes['config:config']!==cj)ups.push({row:{clinica_id:NV.clinicaId,colecao:'config',id:'config',dados:S.config,excluido:false},k:'config:config',j:cj});
  Object.keys(NV.hashes).forEach(k=>{if(k==='config:config'||vistos[k]||!NV.hashes[k])return;const i=k.indexOf(':');ups.push({row:{clinica_id:NV.clinicaId,colecao:k.slice(0,i),id:k.slice(i+1),dados:{},excluido:true},k,j:null})});
  if(!ups.length){setSync('ok');return}setSync('env');
  for(let i=0;i<ups.length;i+=400){const lote=ups.slice(i,i+400);const {error}=await NV.sb.from('registros').upsert(lote.map(u=>u.row),{onConflict:'clinica_id,colecao,id'});if(error)throw error;lote.forEach(u=>{NV.hashes[u.k]=u.j})}
  persistirNuvem();setSync('ok')}
 catch(e){console.warn(e);setSync(navigator.onLine===false||/fetch|network/i.test(String(e&&e.message))?'off':'err')}
 finally{NV.ocupado=false}}
function podeRedesenhar(){const a=document.activeElement;return !$('#modalRoot').innerHTML&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))}
async function sincronizar(){if(!NV.sb||!NV.clinicaId||NV.offline||UI.auth)return;try{const n=await puxar();if(n&&podeRedesenhar())render();await enviar()}catch(e){setSync(navigator.onLine===false?'off':'err')}}
function iniciarSync(){clearInterval(NV.timer);NV.timer=setInterval(sincronizar,30000)}
window.addEventListener('online',()=>{if(NV.offline&&NV.sb)location.reload();else sincronizar()});window.addEventListener('offline',()=>setSync('off'));window.addEventListener('focus',()=>sincronizar());
async function sair(){try{await enviar()}catch(e){}clearInterval(NV.timer);if(NV.sb)await NV.sb.auth.signOut();NV.sessao=null;NV.clinicaId=null;NV.hashes={};NV.cursor=0;S=defaultState();closeModal();UI.auth={modo:'entrar'};render()}
async function abrirConta(){if(!NV.ativa){go('config');return}const u=NV.sessao.user;
 let membros=[],convites=[];if(!NV.offline){const a=await NV.sb.from('membros').select('user_id,email,nome,papel').eq('clinica_id',NV.clinicaId);membros=a.data||[];if(NV.papel==='admin'){const b=await NV.sb.from('convites').select('email,papel').eq('clinica_id',NV.clinicaId);convites=b.data||[]}}
 openModal(`<h3>Minha conta</h3><div class="row"><span>Nome</span><span>${esc(nomeUsuario())}</span></div><div class="row"><span>E-mail</span><span>${esc(u.email)}</span></div><div class="row"><span>Clínica</span><span>${esc(NV.nomeClinica)}</span></div><div class="row"><span>Perfil</span><span>${NV.papel==='admin'?'Administrador':'Usuário'}</span></div><div class="row"><span>Versão</span><span id="verApp">1.2</span></div>
 ${membros.length?`<h3 style="margin-top:20px">Equipe</h3>${membros.map(m=>`<div class="row"><span>${esc(m.nome||m.email)}<br><small style="color:var(--mut);font-weight:400">${esc(m.email)} . ${m.papel==='admin'?'Administrador':'Usuário'}</small></span><span>${NV.papel==='admin'&&m.user_id!==u.id?`<button class="lnk" style="color:var(--bad)" onclick="removerMembro('${m.user_id}','${esc(m.email)}')">Remover</button>`:''}</span></div>`).join('')}`:''}
 ${convites.length?`<h3 style="margin-top:20px">Convites pendentes</h3>${convites.map(c=>`<div class="row"><span>${esc(c.email)}</span><span><button class="lnk" onclick="cancelarConvite('${esc(c.email)}')">Cancelar</button></span></div>`).join('')}`:''}
 ${NV.papel==='admin'&&!NV.offline?`<h3 style="margin-top:20px">Convidar pessoa da equipe</h3><div class="fgrid"><label>E-mail<input id="cv_email" type="email"></label><label>Perfil<select id="cv_papel"><option value="usuario">Usuário</option><option value="admin">Administrador</option></select></label></div><div class="mact" style="justify-content:flex-start"><button class="btn" onclick="convidar()">Enviar convite</button></div><p class="sub">A pessoa baixa o programa, clica em Criar conta e usa exatamente este e-mail. Ao entrar, ela já cai na sua clínica.</p>`:''}
 <div class="mact"><button class="btn ghost" onclick="closeModal()">Fechar</button><button class="btn danger" onclick="sair()">Sair</button></div>`,true);
 if(window.pywebview&&window.pywebview.api&&window.pywebview.api.versao){window.pywebview.api.versao().then(v=>{const e=$('#verApp');if(e)e.textContent=v.app})}}
async function convidar(){const email=val('#cv_email');if(!email){toast('Informe o e-mail');return}const {error}=await NV.sb.rpc('convidar',{p_clinica:NV.clinicaId,p_email:email,p_papel:$('#cv_papel').value});if(error){toast(traduz(error));return}toast('Convite registrado para '+email);abrirConta()}
async function cancelarConvite(email){const {error}=await NV.sb.rpc('cancelar_convite',{p_clinica:NV.clinicaId,p_email:email});if(error)toast(traduz(error));abrirConta()}
function removerMembro(id,email){confirmModal(`Remover <b>${esc(email)}</b> da clínica? A pessoa perde o acesso imediatamente.`,async()=>{const {error}=await NV.sb.rpc('remover_membro',{p_clinica:NV.clinicaId,p_user:id});if(error)toast(traduz(error));else toast('Usuário removido')},'Remover')}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[target=_blank]');if(a&&window.pywebview&&window.pywebview.api&&window.pywebview.api.abrir_link){e.preventDefault();window.pywebview.api.abrir_link(a.href)}});

/* ============ Início do aplicativo ============ */
(async function(){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 if(NV.ativa){
  if(!window.supabase||!window.supabase.createClient){UI.auth={modo:'offline',temCache:!!(await DB.get('ultimo'))};render();return}
  NV.sb=window.supabase.createClient(NUVEM.url,NUVEM.chave,{auth:{persistSession:true,autoRefreshToken:true}});
  NV.sb.auth.onAuthStateChange((ev,ses)=>{if(ev==='TOKEN_REFRESHED'&&ses)NV.sessao=ses});
  let ses=null;try{ses=(await NV.sb.auth.getSession()).data.session}catch(e){}
  if(ses){try{await entrar(ses)}catch(e){UI.auth={modo:'offline',temCache:!!(await DB.get('ultimo'))};render()}}else{UI.auth={modo:'entrar'};render()}
  return}
 const saved=await DB.get();if(saved&&Array.isArray(saved.pacientes)){const d=defaultState();S={...d,...saved,config:{...d.config,...(saved.config||{})}};if(S.config.cor==='#e8622c')S.config.cor='#0a4bde'}
 render();
 const lb=S.config.ultimoBackup;if(S.pacientes.length&&(!lb||diffDays(lb,todayISO())>7))setTimeout(()=>toast('Lembrete: faça o backup semanal em Configurações.'),1500)})();
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();if(UI.drawer){UI.drawer=false;render()}}});
</script>
</body>
</html>
